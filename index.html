            async get(path) {
                try {
                    const snapshot = await db.ref(path).once('value');
                    return snapshot.val();
                } catch (error) {
                    console.error('Error leyendo:', error);
                    return null;
                }

            // Guardar datos
            async set(path, data) {
                try {
                    await db.ref(path).set(data);
                    return true;
                } catch (error) {
                    console.error('Error guardando:', error);
                    return false;
                }
            },
            
            // Escuchar cambios en tiempo real
            listen(path, callback) {
                db.ref(path).on('value', (snapshot) => {
                    callback(snapshot.val());

            // Dejar de escuchar

        // Función global para calcular qué turnos se deben bloquear
        const calcularTurnosBloqueados = (fecha, horaInicio, duracionMinutos) => {
            const bloqueados = [];
            const fechaStr = new Date(fecha).toISOString().split('T')[0];
            
            // Convertir hora inicio a minutos desde medianoche
            const [h, m] = horaInicio.split(':').map(Number);
            let minutosInicio = h * 60 + m;
            const minutosFin = minutosInicio + duracionMinutos;
            
            // Generar todos los turnos de 30 minutos que quedan bloqueados
            while (minutosInicio < minutosFin) {
                const horas = Math.floor(minutosInicio / 60);
                const mins = minutosInicio % 60;
                const horaStr = `${horas.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
                bloqueados.push(`${fechaStr}|${horaStr}`);
                minutosInicio += 30; // Bloques de 30 minutos
            }
            
            return bloqueados;
        };

        // GENERADOR DE HISTORIAS PARA INSTAGRAM
        function GeneradorHistoriaIG({ reservas, horarios, setView }) {
            const [sucursalId, setSucursalId] = useState(1);
            const [fechaInicio, setFechaInicio] = useState(() => {
                const hoy = new Date();
                return hoy.toISOString().split('T')[0];
            });
            const [fechaFin, setFechaFin] = useState(() => {
                const fin = new Date();
                fin.setDate(fin.getDate() + 7);
                return fin.toISOString().split('T')[0];
            });
            const [backgroundIndex, setBackgroundIndex] = useState(0);
            const [opacidad, setOpacidad] = useState(60);
            
            // Biblioteca de backgrounds (URLs de imágenes)
            const backgrounds = [
                'https://images.unsplash.com/photo-1604654894610-df63bc536371?w=1080&h=1920&fit=crop', // Uñas rosas
                'https://images.unsplash.com/photo-1610992015732-2449b76344bc?w=1080&h=1920&fit=crop', // Uñas elegantes
                'https://images.unsplash.com/photo-1519014816548-bf5fe059798b?w=1080&h=1920&fit=crop', // Uñas con diseño
                'https://images.unsplash.com/photo-1632345031435-8727f6897d53?w=1080&h=1920&fit=crop', // Manicura proceso
                'https://images.unsplash.com/photo-1599948128020-9a44cd7b0206?w=1080&h=1920&fit=crop', // Uñas coloridas
            ];

            const sucursal = SUCURSALES.find(s => s.id === sucursalId);
            
            // Generar días para mostrar
            const generarDias = () => {
                const dias = [];
                const inicio = new Date(fechaInicio);
                const fin = new Date(fechaFin);
                
                // Iterar desde fecha inicio hasta fecha fin
                const fechaActual = new Date(inicio);
                while (fechaActual <= fin) {
                    const fechaStr = fechaActual.toISOString().split('T')[0];
                    
                    // Obtener horarios configurados para este día
                    const horariosDia = horarios[sucursalId]?.[fechaStr];
                    if (horariosDia && horariosDia.activo) {
                        const horasConfig = horariosDia.horas || [];
                        
                        // Filtrar horas ocupadas
                        const horasDisponibles = horasConfig.filter(hora => {
                            // Verificar si hay reserva en este horario
                            const ocupado = reservas.some(r => {
                                if (r.estado === 'cancelada') return false;
                                if (r.sucursal.id !== sucursalId) return false;
                                const fechaReserva = new Date(r.fecha).toISOString().split('T')[0];
                                if (fechaReserva !== fechaStr) return false;
                                
                                // Verificar si este turno está bloqueado
                                const turnoKey = `${fechaStr}|${hora}`;
                                return r.turnosBloqueados?.includes(turnoKey);
                            });
                            return !ocupado;
                        });
                        
                        // Marcar horas ocupadas con corazón
                        const horasConEstado = horasConfig.map(hora => ({
                            hora,
                            ocupado: !horasDisponibles.includes(hora)
                        }));
                        
                        dias.push({
                            fecha: new Date(fechaActual),
                            dia: fechaActual.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric' }).toUpperCase(),
                            horas: horasConEstado
                        });
                    }
                    
                    // Avanzar al siguiente día
                    fechaActual.setDate(fechaActual.getDate() + 1);
                }
                
                return dias;
            };
            
            const dias = generarDias();
            
            const descargarImagen = () => {
                const canvas = document.getElementById('historia-canvas');
                const link = document.createElement('a');
                link.download = `historia-${sucursal.nombre}-${new Date().toISOString().split('T')[0]}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };

                const canvas = document.getElementById('historia-canvas');
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const width = 1080;

                canvas.width = width;
                canvas.height = height;
                
                // Cargar imagen de fondo
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = backgrounds[backgroundIndex];
                
                img.onload = () => {
                    // Dibujar fondo
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Overlay semi-transparente
                    ctx.fillStyle = `rgba(0, 0, 0, ${(100 - opacidad) / 100})`;
                    ctx.fillRect(0, 0, width, height);
                    
                    // Texto: ubicación
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`📍 ${sucursal.nombre}`, width / 2, 200);
                    
                    // Título del mes
                    ctx.font = 'bold 72px Arial';
                    const mes = new Date().toLocaleDateString('es-AR', { month: 'long' }).toUpperCase();
                    ctx.fillText(mes, width / 2, 320);
                    
                    // Dibujar días y horarios
                    let y = 450;
                    dias.forEach(dia => {
                        // Día
                        ctx.font = 'bold 56px Arial';
                        ctx.fillStyle = 'white';
                        ctx.fillText(dia.dia, width / 2, y);
                        y += 90;
                        
                        // Dividir horarios en líneas si son muchos (máx 5 por línea para evitar superposición)
                        const horasPorLinea = 5;
                        const lineas = [];
                        for (let i = 0; i < dia.horas.length; i += horasPorLinea) {
                            lineas.push(dia.horas.slice(i, i + horasPorLinea));
                        }
                        
                        // Dibujar cada línea de horarios
                        lineas.forEach(lineaHoras => {
                            ctx.font = 'bold 44px Arial'; // Reducir tamaño para evitar superposición
                            const totalHoras = lineaHoras.length;
                            const espacioEntre = 160; // Aumentar espaciado significativamente
                            const anchoTotal = (totalHoras - 1) * espacioEntre;
                            let x = (width - anchoTotal) / 2;
                            
                            lineaHoras.forEach(h => {
                                if (h.ocupado) {
                                    // Dibujar hora semi-transparente detrás
                                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                                    ctx.fillText(h.hora, x, y);
                                    
                                    // Dibujar corazón encima
                                    ctx.fillStyle = 'white';
                                    ctx.font = 'bold 52px Arial';
                                    ctx.fillText('❤️', x, y);
                                    ctx.font = 'bold 44px Arial';
                                } else {
                                    // Hora disponible - color blanco completo
                                    ctx.fillStyle = 'white';
                                    ctx.fillText(h.hora, x, y);
                                }
                                x += espacioEntre;
                            });
                            
                            y += 75; // Espacio entre líneas de horarios
                        });
                        
                        y += 70; // Espacio extra después de cada día
                    });
                    
                    // Espacio antes del enlace
                    y += 50;
                    
                    // Llamado a la acción - fondo
                    const boxY = Math.min(y, height - 250);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.fillRect(100, boxY - 30, width - 200, 150);
                    
                    // Llamado a la acción - texto
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 52px Arial';
                    ctx.fillText('👆 RESERVÁ TU TURNO', width / 2, boxY + 30);
                    
                    // URL
                    ctx.font = 'bold 42px Arial';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fillText('aldi-turnos.vercel.app', width / 2, boxY + 90);
                };
            }, [sucursalId, fechaInicio, fechaFin, backgroundIndex, opacidad, dias]);

                return (

                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
                            <div className="text-6xl mb-4">✅</div>
                            <h2 className="text-2xl font-bold mb-4">¡Turno ya confirmado!</h2>
                            <p className="text-gray-600 mb-6">Tu turno ya está confirmado. ¡Te esperamos!</p>
                            <div className="bg-pink-50 rounded-xl p-4 text-left">
                                <p><strong>Fecha:</strong> {new Date(reserva.fecha).toLocaleDateString('es-AR')}</p>
                                <p><strong>Hora:</strong> {reserva.hora}</p>
                                <p><strong>Sucursal:</strong> {reserva.sucursal.nombre}</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (exito) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
                            <div className="text-6xl mb-6">✅</div>
                            <h2 className="text-3xl font-bold mb-4">¡Comprobante recibido!</h2>
                            <p className="text-gray-600 mb-6">
                                Gracias {reserva.cliente.nombre}. Verificaremos tu pago y te confirmaremos en breve por WhatsApp.
                            </p>
                            <div className="bg-pink-50 rounded-xl p-6">
                                <p className="text-sm text-gray-600 mb-2">Tu turno:</p>
                                <p className="font-semibold">{new Date(reserva.fecha).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
                                <p className="text-lg font-bold text-blue-600">{reserva.hora}</p>
                                <p className="text-sm text-gray-600 mt-2">{reserva.sucursal.nombre}</p>
                            </div>
                        </div>
                    </div>
                );
            }

            const subirArchivo = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setSubiendo(true);

                // Comprimir imagen antes de guardar
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    // Redimensionar si es muy grande (máx 400px para email)
                    const maxSize = 400;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = (height / width) * maxSize;
                            width = maxSize;
                        } else {
                            width = (width / height) * maxSize;
                            height = maxSize;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convertir a base64 con calidad muy reducida para email
                    const base64 = canvas.toDataURL('image/jpeg', 0.5);
                    
                    // Actualizar reserva con comprobante
                    const actualizadas = reservas.map(r => 
                        r.id === reservaId 
                            ? { ...r, comprobante: base64, fechaComprobante: new Date().toISOString() }
                            : r
                    );
                    guardarReservas(actualizadas);
                    
                    // Enviar email al admin con el comprobante
                    const reservaActualizada = actualizadas.find(r => r.id === reservaId);
                    if (reservaActualizada) {
                        setTimeout(() => {
                            enviarEmailComprobanteGlobal(reservaActualizada, base64, señaFija);
                        }, 1000);
                    }
                    
                    setSubiendo(false);
                    setExito(true);
                };
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-blue-100">
                    <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <span className="text-white font-bold text-2xl">A</span>
                            </div>
                            <h2 className="text-2xl font-bold mb-2">Subí tu comprobante</h2>
                            <p className="text-gray-600">Hola {reserva.cliente.nombre}</p>
                        </div>

                        <div className="bg-pink-50 rounded-xl p-4 mb-6">
                            <p className="text-sm text-gray-600 mb-2">Tu reserva:</p>
                            <p className="font-semibold">{reserva.servicios.map(s => s.nombre).join(', ')}</p>
                            <p className="text-sm text-gray-600">{new Date(reserva.fecha).toLocaleDateString('es-AR')} - {reserva.hora}</p>
                            <p className="text-sm text-gray-600">{reserva.sucursal.nombre}</p>
                            <p className="text-lg font-bold text-green-600 mt-2">Seña: ${señaFija}</p>
                        </div>

                        <div className="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center mb-4 hover:border-blue-400 transition-colors">
                            <input 
                                type="file" 
                                accept="image/*" 
                                onChange={subirArchivo}
                                className="hidden"
                                id="file-upload"
                                disabled={subiendo}
                            />
                            <label htmlFor="file-upload" className="cursor-pointer">
                                {subiendo ? (
                                    <div>
                                        <div className="text-4xl mb-2">📤</div>
                                        <p className="text-gray-600">Subiendo...</p>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="text-5xl mb-2">📸</div>
                                        <p className="font-semibold text-gray-700 mb-1">Click para subir</p>
                                        <p className="text-sm text-gray-500">Foto o captura de pantalla</p>
                                    </div>
                                )}
                            </label>
                        </div>

                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded text-sm">
                            <p className="text-blue-900">
                                <strong>💡 Tip:</strong> Asegurate que se vea claramente el monto de ${señaFija} y la fecha del pago.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // VISTA CLIENTE
        function ClientView({ agregarReserva, setView, servicios, señaFija, horarios, reservas }) {
            const [paso, setPaso] = useState(1);
            const [final, setFinal] = useState(null);
            const [cargando, setCargando] = useState(false);
            const [horaPreferida, setHoraPreferida] = useState('');
            const [mostrarCalendario, setMostrarCalendario] = useState(false);
            const [sel, setSel] = useState({
                sucursal: null,
                servicios: [],
                fecha: null,
                hora: null,
                cliente: { nombre: '', telefono: '+54 9 ' }
            });
            
            const cambiarPaso = (nuevoPaso) => {
                setCargando(true);
                // Resetear estados del paso 3
                if (nuevoPaso !== 3) {
                    setHoraPreferida('');
                    setMostrarCalendario(false);
                }
                setTimeout(() => {
                    setPaso(nuevoPaso);
                    setCargando(false);
                }, 100);
            };

            const toggleServicio = (s) => {
                if (s.esIndeciso) {
                    setSel({...sel, servicios: [s]});
                    return;
                }
                let servs = sel.servicios.filter(x => !x.esIndeciso);
                const existe = servs.find(x => x.id === s.id);
                if (existe) {
                    servs = servs.filter(x => x.id !== s.id);
                } else {
                    servs.push(s);
                }
                setSel({...sel, servicios: servs});
            };

            if (final) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-blue-100">
                        <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
                            <div className="text-6xl mb-4">✅</div>
                            <h2 className="text-3xl font-bold mb-2">¡Reserva Recibida!</h2>
                            <p className="text-gray-600 mb-6">Te enviaremos un WhatsApp con los datos de pago</p>
                            <div className="bg-pink-50 rounded-xl p-4 mb-6">
                                <p className="font-bold">{final.cliente.nombre}</p>
                                <p className="text-sm">{final.servicios.map(s => s.nombre).join(', ')}</p>
                                <p className="text-sm text-gray-600 mt-2">{final.sucursal.nombre}</p>
                                <p className="text-sm text-gray-600">{new Date(final.fecha).toLocaleDateString('es-AR')} - {final.hora}</p>
                                <p className="text-2xl font-bold text-green-600 mt-3">Seña: ${señaFija}</p>
                            </div>
                            <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 text-left text-sm">
                                <p className="text-blue-900">
                                    <strong>📱 Próximos pasos:</strong><br/>
                                    • Recibirás un WhatsApp con el link de pago<br/>
                                    • Pagá la seña y subí el comprobante<br/>
                                    • ¡Listo! Tu turno quedará confirmado
                                </p>
                            </div>
                            <button onClick={() => { setFinal(null); cambiarPaso(1); setSel({...sel, servicios:[]}); }}
                                className="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-4 rounded-xl font-semibold">
                                Cerrar
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100">
                    {cargando && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl p-6 flex flex-col items-center">
                                <div className="spinner mb-3"></div>
                                <p className="text-gray-700">Cargando...</p>
                            </div>
                        </div>

                        {pendientes.length > 0 && (

                                    {pendientes.map(r => (
                                        <div key={r.id} className="bg-white rounded-lg p-4 flex justify-between items-center">
                                            <div>
                                                <p className="font-bold">{r.cliente.nombre}</p>
                                                <p className="text-sm text-gray-600">{r.servicios.map(s => s.nombre).join(', ')}</p>
                                                <p className="text-xs text-gray-500">{new Date(r.fecha).toLocaleDateString('es-AR')} - {r.hora}</p>

                                                    ✓ Confirmar

                        <div className="bg-white rounded-xl shadow">

                                    {filtro === 'todas' && 'Todas las Reservas'}
                                    {filtro === 'pendientes' && 'Esperando Pago'}
                                    {filtro === 'conComprobante' && 'Con Comprobante'}
                                    {filtro === 'confirmadas' && 'Confirmadas'}
                                </h3>

                                    <button onClick={() => setFiltro('todas')} className="text-sm text-blue-600 hover:underline">

                                {(() => {

                                                        <p className="text-sm">{r.servicios.map(s => s.nombre).join(', ')}</p>
                                                        <p className="text-sm text-gray-600">{r.sucursal.nombre}</p>

                                                            </button>

                                                            {r.estado === 'pendiente' && !r.comprobante && <span className="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs">Esperando pago</span>}
                                                            {r.estado === 'pendiente' && r.comprobante && <span className="px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-xs">Con comprobante</span>}
                                                            {r.estado === 'confirmada' && <span className="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs">Confirmada</span>}

                    </div>

            );
        }

        // PANEL DE CONFIGURACIÓN
        function ConfigPanel({ servicios, setServicios, señaFija, setSeñaFija, linkMPago, setLinkMPago, telAdmin, setTelAdmin, horarios, setHorarios, guardarConfig, setView, isLoggedIn, setIsLoggedIn }) {
            const [pass, setPass] = useState('');
            const [guardado, setGuardado] = useState(false);
            const [diasSeleccionados, setDiasSeleccionados] = useState({}); // {sucursalId: 'YYYY-MM-DD'}

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                        <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
                            <h2 className="text-2xl font-bold mb-6 text-center">Configuración</h2>
                            <input type="password" placeholder="Contraseña"
                                className="w-full p-3 border-2 rounded-lg mb-2"
                                value={pass}
                                onChange={(e) => setPass(e.target.value)}
                            />
                            <p className="text-xs text-gray-500 mb-4">Demo: admin123</p>
                            <button onClick={() => pass === 'admin123' ? setIsLoggedIn(true) : alert('❌ Incorrecto')}
                                className="w-full bg-blue-600 text-white py-3 rounded-lg mb-2">
                                Ingresar
                            </button>
                            <button onClick={() => setView('admin')} className="w-full bg-gray-100 py-3 rounded-lg">
                                Volver
                            </button>
                        </div>
                    </div>
                );
            }

            const agregarServicio = () => {
                const nuevoId = Math.max(...servicios.map(s => s.id)) + 1;
                setServicios([...servicios, { id: nuevoId, nombre: 'Nuevo Servicio', duracion: 60, precio: 0 }]);
            };

            const editarServicio = (id, campo, valor) => {
                setServicios(servicios.map(s => s.id === id ? {...s, [campo]: valor} : s));
            };

            const eliminarServicio = (id) => {
                if (confirm('¿Eliminar este servicio?')) {
                    setServicios(servicios.filter(s => s.id !== id));
                }
            };

            const moverServicio = (index, direccion) => {
                const nuevosServicios = [...servicios.filter(s => !s.esIndeciso)];
                if (direccion === 'arriba' && index > 0) {
                    [nuevosServicios[index - 1], nuevosServicios[index]] = [nuevosServicios[index], nuevosServicios[index - 1]];
                } else if (direccion === 'abajo' && index < nuevosServicios.length - 1) {
                    [nuevosServicios[index], nuevosServicios[index + 1]] = [nuevosServicios[index + 1], nuevosServicios[index]];
                }
                // Agregar de vuelta el servicio "indeciso" al final
                const indeciso = servicios.find(s => s.esIndeciso);
                setServicios(indeciso ? [...nuevosServicios, indeciso] : nuevosServicios);
            };

            const guardar = () => {
                try {
                    guardarConfig();
                    setGuardado(true);
                    setTimeout(() => setGuardado(false), 3000);
                } catch (error) {
                    alert('❌ Error al guardar: ' + error.message);
                    console.error('Error guardando:', error);
                }
            };

            return (
                <div className="min-h-screen bg-gray-100">
                    <header className="bg-white shadow p-4">
                        <div className="max-w-5xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold">Configuración</h1>
                            <button onClick={() => setView('admin')} className="px-4 py-2 bg-gray-100 rounded-lg">Volver</button>
                        </div>
                    </header>

                    <div className="max-w-5xl mx-auto p-4 space-y-6">
                        {guardado && (
                            <div className="bg-green-50 border-l-4 border-green-500 p-4 rounded">
                                <p className="text-green-800 font-medium">✓ Cambios guardados</p>
                            </div>
                        )}

                        {/* Seña y MercadoPago */}
                        <div className="bg-white rounded-xl shadow p-6">
                            <h3 className="font-bold text-lg mb-4">💰 Seña y Pago</h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Seña fija (para todos los servicios)</label>
                                    <input type="number"
                                        className="w-full p-3 border-2 rounded-lg"
                                        value={señaFija}
                                        onChange={(e) => setSeñaFija(parseInt(e.target.value) || 0)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Link de MercadoPago</label>
                                    <input type="url"
                                        className="w-full p-3 border-2 rounded-lg"
                                        value={linkMPago}
                                        onChange={(e) => setLinkMPago(e.target.value)}
                                        placeholder="https://mpago.la/..."
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">📱 Tu WhatsApp (Admin - para notificaciones)</label>
                                    <input type="tel"
                                        className="w-full p-3 border-2 rounded-lg font-mono"
                                        value={telAdmin}
                                        onChange={(e) => setTelAdmin(e.target.value)}
                                        placeholder="5492920601373"
                                    />
                                    <p className="text-xs text-gray-500 mt-1">
                                        Formato: código país + código área + número (sin espacios ni guiones)
                                        <br/>Ejemplo: 5492920601373 para +54 9 292 0601373
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Servicios */}
                        <div className="bg-white rounded-xl shadow p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-lg">💅 Servicios</h3>
                                <button onClick={agregarServicio}
                                    className="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold">
                                    + Agregar
                                </button>
                            </div>
                            <div className="space-y-3">
                                {servicios.filter(s => !s.esIndeciso).map((s, index) => (
                                    <div key={s.id} className="border-2 rounded-lg p-4 space-y-3">
                                        <div className="flex items-start gap-3">
                                            {/* Botones de ordenar */}
                                            <div className="flex flex-col gap-1">
                                                <button 
                                                    onClick={() => moverServicio(index, 'arriba')}
                                                    disabled={index === 0}
                                                    className={`p-1 rounded ${index === 0 ? 'text-gray-300 cursor-not-allowed' : 'text-blue-600 hover:bg-blue-50'}`}
                                                    title="Mover arriba">
                                                    ▲
                                                </button>
                                                <button 
                                                    onClick={() => moverServicio(index, 'abajo')}
                                                    disabled={index === servicios.filter(s => !s.esIndeciso).length - 1}
                                                    className={`p-1 rounded ${index === servicios.filter(s => !s.esIndeciso).length - 1 ? 'text-gray-300 cursor-not-allowed' : 'text-blue-600 hover:bg-blue-50'}`}
                                                    title="Mover abajo">
                                                    ▼
                                                </button>
                                            </div>
                                            
                                            {/* Formulario del servicio */}
                                            <div className="flex-1">
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                                                    <div>
                                                        <label className="block text-xs text-gray-500 mb-1">Nombre</label>
                                                        <input type="text"
                                                            className="w-full p-2 border rounded"
                                                            value={s.nombre}
                                                            onChange={(e) => editarServicio(s.id, 'nombre', e.target.value)}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-gray-500 mb-1">Duración (min)</label>
                                                        <input type="number"
                                                            className="w-full p-2 border rounded"
                                                            value={s.duracion}
                                                            onChange={(e) => editarServicio(s.id, 'duracion', parseInt(e.target.value) || 0)}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-gray-500 mb-1">Precio</label>
                                                        <input type="number"
                                                            className="w-full p-2 border rounded"
                                                            value={s.precio}
                                                            onChange={(e) => editarServicio(s.id, 'precio', parseInt(e.target.value) || 0)}
                                                        />
                                                    </div>
                                                </div>
                                                <button onClick={() => eliminarServicio(s.id)}
                                                    className="text-red-600 text-sm font-medium hover:text-red-700">
                                                    🗑️ Eliminar
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Horarios por sucursal - CALENDARIO */}
                        <div className="bg-white rounded-xl shadow p-6">
                            <h3 className="font-bold text-lg mb-2">📅 Calendario de Disponibilidad</h3>
                            <p className="text-sm text-gray-600 mb-4">Configurá los horarios disponibles para cada día de las próximas 4 semanas</p>
                            <div className="bg-blue-50 rounded-lg p-4 mb-6 flex flex-wrap gap-4 items-center justify-between">
                                <div className="flex gap-4 text-xs">
                                    <div className="flex items-center gap-2">
                                        <div className="w-4 h-4 bg-green-100 border-2 border-green-300 rounded"></div>
                                        <span>Con turnos</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="w-4 h-4 bg-gray-50 border-2 border-gray-200 rounded"></div>
                                        <span>Sin turnos</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="w-4 h-4 bg-blue-600 rounded ring-2 ring-blue-300"></div>
                                        <span>Seleccionado</span>
                                    </div>
                                </div>
                                <div className="text-xs text-gray-600">
                                    💡 Click en un día para configurar sus horarios
                                </div>
                            </div>
                            
                            {SUCURSALES.map(suc => {
                                const diaSeleccionado = diasSeleccionados[suc.id] || null;
                                const setDiaSeleccionado = (fecha) => {
                                    setDiasSeleccionados({...diasSeleccionados, [suc.id]: fecha});
                                };
                                
                                // Generar próximas 4 semanas
                                const dias = [];
                                for (let i = 0; i < 28; i++) {
                                    const fecha = new Date();
                                    fecha.setDate(fecha.getDate() + i);
                                    dias.push(fecha);
                                }
                                
                                const todasLasHoras = [];
                                for (let h = 7; h <= 20; h++) {
                                    for (let m of ['00', '30']) {
                                        todasLasHoras.push(`${h.toString().padStart(2, '0')}:${m}`);
                                    }
                                }
                                
                                return (
                                    <div key={suc.id} className="mb-8 last:mb-0">
                                        <h4 className="font-semibold text-gray-700 mb-4 flex items-center gap-2">
                                            <span className="text-blue-500">📍</span> {suc.nombre}
                                        </h4>
                                        
                                        {/* Calendario */}
                                        <div className="grid grid-cols-7 gap-2 mb-6">
                                            {/* Headers */}
                                            {['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map(dia => (
                                                <div key={dia} className="text-center text-xs font-semibold text-gray-600 py-2">
                                                    {dia}
                                                </div>
                                            ))}
                                            
                                            {/* Días del mes */}
                                            {dias.map((fecha, idx) => {
                                                const fechaStr = fecha.toISOString().split('T')[0];
                                                const horariosSeucursal = horarios[suc.id] || {};
                                                const config = horariosSeucursal[fechaStr];
                                                const tieneHorarios = config && config.horas && config.horas.length > 0;
                                                const esHoy = fecha.toDateString() === new Date().toDateString();
                                                const diaSemana = fecha.getDay();
                                                
                                                // Padding para alinear con día de la semana
                                                if (idx === 0) {
                                                    const padding = [];
                                                    for (let p = 0; p < diaSemana; p++) {
                                                        padding.push(<div key={`pad-${p}`} />);
                                                    }
                                                    return [
                                                        ...padding,
                                                        <button
                                                            key={fechaStr}
                                                            onClick={() => setDiaSeleccionado(fechaStr)}
                                                            className={`p-3 rounded-lg text-sm transition-all ${
                                                                diaSeleccionado === fechaStr
                                                                    ? 'bg-blue-600 text-white font-bold ring-2 ring-blue-300'
                                                                    : tieneHorarios
                                                                    ? 'bg-green-100 text-green-800 hover:bg-green-200'
                                                                    : 'bg-gray-50 text-gray-600 hover:bg-gray-100'
                                                            } ${esHoy ? 'ring-2 ring-blue-400' : ''}`}>
                                                            <div className="font-semibold">{fecha.getDate()}</div>
                                                            <div className="text-xs">{['D','L','M','X','J','V','S'][diaSemana]}</div>
                                                            {tieneHorarios && <div className="text-xs mt-1">✓</div>}
                                                        </button>
                                                    ];
                                                }
                                                
                                                return (
                                                    <button
                                                        key={fechaStr}
                                                        onClick={() => setDiaSeleccionado(fechaStr)}
                                                        className={`p-3 rounded-lg text-sm transition-all ${
                                                            diaSeleccionado === fechaStr
                                                                ? 'bg-blue-600 text-white font-bold ring-2 ring-blue-300'
                                                                : tieneHorarios
                                                                ? 'bg-green-100 text-green-800 hover:bg-green-200'
                                                                : 'bg-gray-50 text-gray-600 hover:bg-gray-100'
                                                        } ${esHoy ? 'ring-2 ring-blue-400' : ''}`}>
                                                        <div className="font-semibold">{fecha.getDate()}</div>
                                                        <div className="text-xs">{['D','L','M','X','J','V','S'][diaSemana]}</div>
                                                        {tieneHorarios && <div className="text-xs mt-1">✓</div>}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        
                                        {/* Editor de horarios del día seleccionado */}
                                        {diaSeleccionado && (() => {
                                            const fecha = new Date(diaSeleccionado + 'T12:00:00');
                                            const horariosSeucursal = horarios[suc.id] || {};
                                            const config = horariosSeucursal[diaSeleccionado] || { activo: false, horas: [] };
                                            
                                            return (
                                                <div className="bg-blue-50 rounded-lg p-4">
                                                    <div className="flex justify-between items-center mb-4">
                                                        <h5 className="font-semibold">
                                                            {fecha.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' })}
                                                        </h5>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => {
                                                                    const nuevos = {...horarios};
                                                                    if (!nuevos[suc.id]) nuevos[suc.id] = {};
                                                                    if (!nuevos[suc.id][diaSeleccionado]) nuevos[suc.id][diaSeleccionado] = {};
                                                                    nuevos[suc.id][diaSeleccionado] = { 
                                                                        activo: true, 
                                                                        horas: todasLasHoras.slice(4, 24) // 09:00 a 18:30
                                                                    };
                                                                    setHorarios(nuevos);
                                                                }}
                                                                className="text-xs px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700">
                                                                Jornada completa
                                                            </button>
                                                            <button onClick={() => {
                                                                    const nuevos = {...horarios};
                                                                    if (!nuevos[suc.id]) nuevos[suc.id] = {};
                                                                    if (nuevos[suc.id][diaSeleccionado]) {
                                                                        delete nuevos[suc.id][diaSeleccionado];
                                                                    }
                                                                    setHorarios(nuevos);
                                                                    setDiasSeleccionados({...diasSeleccionados, [suc.id]: null});
                                                                }}
                                                                className="text-xs px-3 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200">
                                                                Cerrado
                                                            </button>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="grid grid-cols-6 sm:grid-cols-8 gap-2">
                                                        {todasLasHoras.map(hora => {
                                                            const seleccionada = config.horas?.includes(hora);
                                                            return (
                                                                <button key={hora}
                                                                    onClick={() => {
                                                                        const nuevos = {...horarios};
                                                                        if (!nuevos[suc.id]) nuevos[suc.id] = {};
                                                                        if (!nuevos[suc.id][diaSeleccionado]) {
                                                                            nuevos[suc.id][diaSeleccionado] = { activo: true, horas: [] };
                                                                        }
                                                                        const horas = nuevos[suc.id][diaSeleccionado].horas || [];
                                                                        if (seleccionada) {
                                                                            nuevos[suc.id][diaSeleccionado].horas = horas.filter(h => h !== hora);
                                                                        } else {
                                                                            nuevos[suc.id][diaSeleccionado].horas = [...horas, hora].sort();
                                                                        }
                                                                        nuevos[suc.id][diaSeleccionado].activo = nuevos[suc.id][diaSeleccionado].horas.length > 0;
                                                                        setHorarios(nuevos);
                                                                    }}
                                                                    className={`px-2 py-2 text-xs rounded transition-all ${
                                                                        seleccionada
                                                                            ? 'bg-blue-600 text-white font-semibold'
                                                                            : 'bg-white border hover:bg-blue-50'
                                                                    }`}>
                                                                    {hora}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                );
                            })}
                        </div>

                        {guardado && (
                            <div className="fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg animate-pulse z-50">
                                ✓ Cambios guardados correctamente
                            </div>
                        )}

                        <button onClick={guardar}
                            className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition-colors">
                            💾 Guardar Todo
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
