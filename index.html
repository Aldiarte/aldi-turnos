        const calcularTurnosBloqueados = (fecha, horaInicio, duracionMinutos) => {
            const bloqueados = [];
            const fechaStr = new Date(fecha).toISOString().split('T')[0];
            
            // Convertir hora inicio a minutos desde medianoche
            const [h, m] = horaInicio.split(':').map(Number);
            let minutosInicio = h * 60 + m;
            const minutosFin = minutosInicio + duracionMinutos;
            
            // Generar todos los turnos de 30 minutos que quedan bloqueados
            while (minutosInicio < minutosFin) {
                const horas = Math.floor(minutosInicio / 60);
                const mins = minutosInicio % 60;
                const horaStr = `${horas.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;

                    const horariosDia = horarios[sucursalId]?.[fechaStr];
                    
                    dias.push({
                        fecha: fechaStr,
                        fechaObj: new Date(fecha),
                        activo: horariosDia?.activo || false,
                        horas: horariosDia?.horas || []
                    });
                }
                
                return dias;
            };
            
            const dias = generarDias();
            const diaSeleccionado = dias.find(d => d.fecha === fechaSeleccionada);
            
            // Obtener estado de cada hora
            const obtenerEstadoHora = (hora) => {
                const turnoKey = `${fechaSeleccionada}|${hora}`;
                
                // Buscar reservas que bloquean este turno
                const reservasEnEsteTurno = reservas.filter(r => {
                    if (r.estado === 'cancelada') return false;
                    if (r.sucursal.id !== sucursalId) return false;
                    return r.turnosBloqueados?.includes(turnoKey);
                });
                
                if (reservasEnEsteTurno.length === 0) {
                    return { estado: 'libre', reserva: null };
                }
                
                return { 
                    estado: 'ocupado', 
                    reserva: reservasEnEsteTurno[0] // Primera reserva que bloquea
                };
            };
            
            return (
                <div className="min-h-screen bg-gray-100 p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-6 flex items-center justify-between">

                                        const totalHoras = dia.horas.length;
                                        const porcentaje = totalHoras > 0 ? Math.round((horasOcupadas / totalHoras) * 100) : 0;

                                            <button

                            </div>
                            
                            {/* Horarios del día */}
                            <div className="md:col-span-2 bg-white rounded-xl shadow p-6">
                                <h2 className="font-bold mb-4">

                                {!diaSeleccionado?.activo ? (

                                ) : diaSeleccionado.horas.length === 0 ? (

                                        <div className="text-6xl mb-4">⏰</div>

                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                        {diaSeleccionado.horas.map(hora => {

                                                        {estado === 'libre' ? (

                                                                <div className="text-xs text-green-600 mt-1">✓ Libre</div>
                                                                <div className="flex flex-col gap-1 mt-2">

                                                            <div className="text-xs text-red-600 mt-1">
                                                                <div>❤️ Ocupado</div>
                                                                <div className="mt-1 truncate" title={reserva?.cliente?.nombre}>

                                        })}

                                )}
                                
                                {/* Leyenda */}
                                <div className="mt-6 pt-6 border-t flex gap-6 text-sm flex-wrap">
                                    <div className="flex items-center gap-2">
                                        <div className="w-4 h-4 bg-green-200 border-2 border-green-400 rounded"></div>
                                        <span>Libre</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="w-4 h-4 bg-red-200 border-2 border-red-400 rounded"></div>
                                        <span>Ocupado</span>

                                    <div className="flex items-center gap-2 text-blue-600">
                                        <span>👤 Turno real</span>
                                        <span className="text-gray-400">= carga con datos de clienta</span>

                                    <div className="flex items-center gap-2 text-gray-500">
                                        <span>🔒 Bloquear</span>
                                        <span className="text-gray-400">= bloqueo sin reserva</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MODAL TURNO REAL */}
                    {modalTurno && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-screen overflow-y-auto">
                                <div className="p-6">
                                    <div className="flex justify-between items-center mb-6">
                                        <div>
                                            <h2 className="text-xl font-bold">👤 Cargar Turno Real</h2>
                                            <p className="text-sm text-gray-500 mt-1">
                                                📅 {(() => { const [y,m,d] = modalTurno.fecha.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'}); })()} · ⏰ {modalTurno.hora}
                                            </p>
                                        </div>
                                        <button onClick={() => setModalTurno(null)} className="text-gray-400 hover:text-gray-600 text-2xl">✕</button>
                                    </div>

                                    <div className="space-y-4">
                                        {/* Nombre */}
                                        <div>

                                            <input type="text" value={formTurno.nombre}
                                                onChange={e => setFormTurno({...formTurno, nombre: e.target.value})}
                                                className="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none"
                                                placeholder="Ej: María García" />

                                        {/* Teléfono */}
                                        <div>
                                            <label className="block text-sm font-semibold mb-1">Teléfono *</label>
                                            <input type="tel" value={formTurno.telefono}
                                                onChange={e => setFormTurno({...formTurno, telefono: e.target.value})}
                                                className="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none"
                                                placeholder="Ej: 2914567890" />
                                        </div>

                                        {/* Servicios */}
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Servicios *</label>
                                            <div className="space-y-2 max-h-48 overflow-y-auto border-2 rounded-xl p-3">
                                                {servicios.filter(s => !s.esIndeciso).map(s => (

                                                            checked={formTurno.serviciosIds.includes(s.id)}
                                                            onChange={e => {

                                                                    ? [...formTurno.serviciosIds, s.id]
                                                                    : formTurno.serviciosIds.filter(id => id !== s.id);

                                                        <div>

                                                            <p className="text-xs text-gray-500">⏱️ {s.duracion}min · ${new Intl.NumberFormat('es-AR').format(s.precio)}</p>
                                                        </div>

                                            {formTurno.serviciosIds.length > 0 && (
                                                <div className="mt-2 p-3 bg-blue-50 rounded-xl text-sm">

                                                        <span className="font-semibold">{servicios.filter(s => formTurno.serviciosIds.includes(s.id)).reduce((s,sv)=>s+sv.duracion,0)} min</span>

                                                        <span>💰 Total:</span>
                                                        <span className="font-semibold text-green-600">${new Intl.NumberFormat('es-AR').format(servicios.filter(s => formTurno.serviciosIds.includes(s.id)).reduce((s,sv)=>s+sv.precio,0))}</span>

                                        {/* Notas */}

                                            <input type="text" value={formTurno.notas}
                                                onChange={e => setFormTurno({...formTurno, notas: e.target.value})}
                                                className="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none"
                                                placeholder="Ej: Viene con su hermana, prefiere esmalte oscuro..." />
                                        </div>
                                    </div>

                                    <div className="flex gap-3 mt-6">
                                        <button onClick={guardarTurnoReal}
                                            className="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">
                                            ✅ Confirmar Turno
                                        </button>
                                        <button onClick={() => setModalTurno(null)}
                                            className="px-4 py-3 bg-gray-200 rounded-xl hover:bg-gray-300">
                                            Cancelar
                                        </button>

                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // PANEL DE ANÁLISIS CON FIREBASE Y EXCEL
        function PanelAnalisis({ reservas, servicios, setView }) {
            const formatearNumero = (num) => new Intl.NumberFormat('es-AR').format(num || 0);

            const [registros, setRegistros] = useState([]);
            const [cargando, setCargando] = useState(true);
            const [vistaActual, setVistaActual] = useState('dashboard');
            const [paginaActual, setPaginaActual] = useState(1);
            const [mostrarFormulario, setMostrarFormulario] = useState(false);
            const REGISTROS_POR_PAGINA = 50;

            const cargarFiltrosGuardados = () => {
                try {
                    const g = localStorage.getItem('filtrosAnalisis');
                    return g ? JSON.parse(g) : { fechaInicio:'', fechaFin:'', clienta:'', servicio:'', metodoPago:'', sucursal:'' };
                } catch { return { fechaInicio:'', fechaFin:'', clienta:'', servicio:'', metodoPago:'', sucursal:'' }; }
            };

            const [filtros, setFiltros] = useState(cargarFiltrosGuardados());
            const [nuevoRegistro, setNuevoRegistro] = useState({
                fecha: new Date().toISOString().split('T')[0],
                clienta: '', servicios: [], importe: 0,
                metodoPago: 'efectivo', sucursal: 'Bahía Blanca', notas: ''
            });
            const [editando, setEditando] = useState(null);
            const [formEdit, setFormEdit] = useState({ clienta:'', servicios:[], importe:0, metodoPago:'efectivo', sucursal:'Bahía Blanca', notas:'' });

            // Persistir filtros
            useEffect(() => { localStorage.setItem('filtrosAnalisis', JSON.stringify(filtros)); }, [filtros]);

            // Cargar desde Firebase
            useEffect(() => {
                const cargar = async () => {
                    try {
                        const data = await FirebaseDB.get('registrosIngresos');
                        setRegistros(Array.isArray(data) ? data : (data ? Object.values(data) : []));
                    } catch(e) {
                        console.error('Error cargando:', e);
                        setRegistros([]);
                    }
                    setCargando(false);
                };
                cargar();
            }, []);

            // Guardar en Firebase
            const guardarRegistros = async (nuevos) => {
                setRegistros(nuevos);
                try {
                    await FirebaseDB.set('registrosIngresos', nuevos);
                    return true;
                } catch(e) {
                    console.error('Error guardando:', e);
                    alert('❌ Error al guardar. Intentá de nuevo.');
                    return false;
                }
            };

            // Filtrar con useMemo
            const registrosFiltrados = useMemo(() => {
                return registros.filter(r => {
                    if (!r || !r.fecha) return false;
                    if (filtros.fechaInicio && r.fecha < filtros.fechaInicio) return false;
                    if (filtros.fechaFin && r.fecha > filtros.fechaFin) return false;
                    if (filtros.clienta && !r.clienta?.toLowerCase().includes(filtros.clienta.toLowerCase())) return false;
                    if (filtros.servicio && !r.servicios?.some(s => s?.toLowerCase().includes(filtros.servicio.toLowerCase()))) return false;
                    if (filtros.metodoPago && r.metodoPago !== filtros.metodoPago) return false;
                    if (filtros.sucursal && r.sucursal !== filtros.sucursal) return false;
                    return true;
                }).sort((a,b) => b.fecha.localeCompare(a.fecha));
            }, [registros, filtros]);

            // Resetear página al filtrar
            useEffect(() => { setPaginaActual(1); }, [filtros]);

            // Paginación
            const totalPaginas = Math.max(1, Math.ceil(registrosFiltrados.length / REGISTROS_POR_PAGINA));
            const registrosPaginados = useMemo(() => {
                const ini = (paginaActual - 1) * REGISTROS_POR_PAGINA;
                return registrosFiltrados.slice(ini, ini + REGISTROS_POR_PAGINA);
            }, [registrosFiltrados, paginaActual]);

            // Stats
            const stats = useMemo(() => ({
                totalIngresos: registrosFiltrados.reduce((s,r) => s + (r.importe||0), 0),
                cantidadServicios: registrosFiltrados.length,
                ticketPromedio: registrosFiltrados.length > 0 ? registrosFiltrados.reduce((s,r) => s+(r.importe||0), 0) / registrosFiltrados.length : 0,
                clientasUnicas: new Set(registrosFiltrados.map(r=>r.clienta).filter(Boolean)).size
            }), [registrosFiltrados]);

            const serviciosMasVendidos = useMemo(() => {
                const c = {};
                registrosFiltrados.forEach(r => r.servicios?.forEach(s => { if(s) c[s]=(c[s]||0)+1; }));
                return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
            }, [registrosFiltrados]);

            const ingresosPorMes = useMemo(() => {
                const m = {};
                registrosFiltrados.forEach(r => {
                    if (!r.fecha || typeof r.fecha !== 'string') return;
                    const mes = r.fecha.substring(0,7);
                    m[mes] = (m[mes]||0) + (r.importe||0);
                });
                return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
            }, [registrosFiltrados]);

            // Datos comparativo (todos los registros, no filtrados)
            const datosComparativo = useMemo(() => {
                const años = {}, trimestres = {}, mesesPorAño = {}, clientasPorAño = {};
                registros.forEach(r => {
                    if (!r?.fecha || typeof r.fecha !== 'string') return;
                    const parts = r.fecha.split('-');
                    if (parts.length < 2) return;
                    const [año, mes] = parts;
                    const mesNum = parseInt(mes);
                    const imp = r.importe || 0;
                    const cl = r.clienta || '';
                    if (!año || isNaN(mesNum)) return;

                    if (!años[año]) años[año] = { ingresos:0, servicios:0, clientas:new Set() };
                    años[año].ingresos += imp; años[año].servicios++; if(cl) años[año].clientas.add(cl);

                    const q = mesNum<=3?'Q1':mesNum<=6?'Q2':mesNum<=9?'Q3':'Q4';
                    const tk = `${q}-${año}`;
                    if (!trimestres[tk]) trimestres[tk] = { año, trimestre:q, ingresos:0, servicios:0 };
                    trimestres[tk].ingresos += imp; trimestres[tk].servicios++;

                    if (!mesesPorAño[mes]) mesesPorAño[mes] = {};
                    mesesPorAño[mes][año] = (mesesPorAño[mes][año]||0) + imp;

                    if (!clientasPorAño[año]) clientasPorAño[año] = {};
                    if (cl) clientasPorAño[año][cl] = (clientasPorAño[año][cl]||0) + imp;
                });
                return { años, trimestres, mesesPorAño, clientasPorAño };
            }, [registros]);

            // Funciones CRUD
            const agregarRegistro = async () => {
                if (!nuevoRegistro.clienta || !nuevoRegistro.servicios.length) { alert('Completá clienta y servicios'); return; }
                const reg = { ...nuevoRegistro, id: Date.now(), normalizado:true, fechaCreacion: new Date().toISOString() };
                if (await guardarRegistros([...registros, reg])) {
                    setNuevoRegistro({ fecha:new Date().toISOString().split('T')[0], clienta:'', servicios:[], importe:0, metodoPago:'efectivo', sucursal:'Bahía Blanca', notas:'' });
                    setMostrarFormulario(false);
                    alert('✅ Registro agregado');
                }
            };

            const importarDesdeReservas = async () => {
                const confirmadas = reservas.filter(r => r.estado==='confirmada' && !r.esFicticia);
                const nuevos = [];
                confirmadas.forEach(r => {
                    const existe = registros.some(reg => reg.clienta===r.cliente.nombre && reg.fecha===r.fecha && reg.importe===r.servicios.reduce((s,sv)=>s+sv.precio,0));
                    if (!existe) nuevos.push({
                        id: Date.now()+Math.random(), fecha:r.fecha, clienta:r.cliente.nombre,
                        servicios:r.servicios.map(s=>s.nombre), importe:r.servicios.reduce((s,sv)=>s+sv.precio,0),
                        metodoPago:'transferencia', sucursal:r.sucursal.nombre, notas:'Importado desde reserva',
                        normalizado:true, fechaCreacion:new Date().toISOString()
                    });
                });
                if (nuevos.length > 0) {
                    if (await guardarRegistros([...registros, ...nuevos])) alert(`✅ ${nuevos.length} registros importados`);
                } else { alert('No hay nuevas reservas para importar'); }
            };

            const exportarExcel = () => {
                try {
                    const datos = registrosFiltrados.map(r => ({ Fecha:r.fecha, Clienta:r.clienta, Servicios:r.servicios?.join(', '), Importe:r.importe, 'Método Pago':r.metodoPago, Sucursal:r.sucursal, Notas:r.notas||'' }));
                    const ws = XLSX.utils.json_to_sheet(datos);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Registros");
                    XLSX.writeFile(wb, `analisis-aldi-${new Date().toISOString().split('T')[0]}.xlsx`);
                } catch(e) { alert('Error exportando: ' + e.message); }
            };

            const importarExcel = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const data = new Uint8Array(ev.target.result);
                        const wb = XLSX.read(data, {type:'array'});
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        const nuevos = rows.map(row => {
                            let fecha = row.FECHA||row.Fecha||row.fecha||'';
                            if (typeof fecha === 'number') {
                                const d = new Date(new Date(1900,0,1).getTime() + (fecha-2)*86400000);
                                fecha = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                            } else if (typeof fecha==='string' && fecha.includes('/')) {
                                const p = fecha.split('/');
                                if (p.length===3) fecha = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
                            }
                            const clienta = row.CLIENTE||row.Cliente||row.Clienta||row.clienta||'';
                            const servicio = row.SERVICIO||row.Servicio||row.Servicios||row.servicios||'';
                            const precio = parseFloat(row.PRECIO||row.Precio||row.Importe||row.importe)||0;
                            return {
                                id: Date.now()+Math.random(), fecha, clienta,
                                servicios: servicio ? servicio.toString().split(',').map(s=>s.trim()).filter(Boolean) : [],
                                importe: precio, metodoPago: (row.PAGO||row.Pago||'efectivo').toString().toLowerCase(),
                                sucursal: row.Sucursal||row.sucursal||'Bahía Blanca', notas: 'Importado de Excel',
                                normalizado: !!(clienta && servicio), fechaCreacion: new Date().toISOString()
                            };
                        }).filter(r => r.fecha && r.importe > 0 && /^\d{4}-\d{2}-\d{2}$/.test(r.fecha));
                        if (nuevos.length > 0) {
                            if (await guardarRegistros([...registros, ...nuevos])) alert(`✅ ${nuevos.length} registros importados`);
                        } else { alert('❌ No se encontraron registros válidos.'); }
                    } catch(err) { alert('❌ Error al importar: ' + err.message); }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            };

            const eliminarMasivo = () => {
                const opc = prompt(`Eliminación masiva:\n1 - Registros del período filtrado (${registrosFiltrados.length})\n2 - Por rango de fechas\n3 - Anteriores a fecha\n4 - TODOS (${registros.length})\n\nIngresá el número:`);

                if (opc==='1') {
                    if (registrosFiltrados.length===registros.length) { alert('Aplicá un filtro primero'); return; }
                    if (!confirm(`⚠️ ¿Eliminar ${registrosFiltrados.length} registros filtrados?\n¡No se puede deshacer!`)) return;
                    const ids = new Set(registrosFiltrados.map(r=>r.id));
                    guardarRegistros(registros.filter(r=>!ids.has(r.id)));
                } else if (opc==='2') {
                    const ini = prompt('Fecha inicio (YYYY-MM-DD):'); if (!ini) return;
                    const fin = prompt('Fecha fin (YYYY-MM-DD):'); if (!fin) return;
                    const a = registros.filter(r=>r.fecha>=ini && r.fecha<=fin);
                    if (!a.length) { alert('No hay registros en ese rango'); return; }
                    if (!confirm(`⚠️ ¿Eliminar ${a.length} registros?\n¡No se puede deshacer!`)) return;
                    guardarRegistros(registros.filter(r=>r.fecha<ini||r.fecha>fin));
                } else if (opc==='3') {
                    const f = prompt('Eliminar anteriores a (YYYY-MM-DD):'); if (!f) return;
                    const a = registros.filter(r=>r.fecha<f);
                    if (!a.length) { alert('No hay registros anteriores a esa fecha'); return; }
                    if (!confirm(`⚠️ ¿Eliminar ${a.length} registros?\n¡No se puede deshacer!`)) return;
                    guardarRegistros(registros.filter(r=>r.fecha>=f));
                } else if (opc==='4') {
                    if (!confirm(`⚠️ ¿ELIMINAR LOS ${registros.length} REGISTROS?\n¡NO SE PUEDE DESHACER!`)) return;
                    guardarRegistros([]);

            if (cargando) return (

                    <div className="max-w-7xl mx-auto p-4 space-y-6">

                        {/* ===== DASHBOARD ===== */}
                        {vistaActual === 'dashboard' && (
                            <>

                                    {[
                                        {label:'Ingresos Totales', val:`$${formatearNumero(stats.totalIngresos)}`, color:'text-green-600'},
                                        {label:'Servicios', val:stats.cantidadServicios, color:'text-blue-600'},

                                            <div><label className="block text-sm mb-1">Importe $</label>
                                                <input type="number" value={nuevoRegistro.importe} onChange={e=>setNuevoRegistro({...nuevoRegistro,importe:parseFloat(e.target.value)||0})} className="w-full p-2 border rounded"/></div>
                                            <div><label className="block text-sm mb-1">Método de Pago</label>
                                                <select value={nuevoRegistro.metodoPago} onChange={e=>setNuevoRegistro({...nuevoRegistro,metodoPago:e.target.value})} className="w-full p-2 border rounded">
                                                    <option value="efectivo">Efectivo</option>
                                                    <option value="transferencia">Transferencia</option>
                                                    <option value="mercadopago">MercadoPago</option>
                                                </select></div>
                                            <div><label className="block text-sm mb-1">Sucursal</label>
                                                <select value={nuevoRegistro.sucursal} onChange={e=>setNuevoRegistro({...nuevoRegistro,sucursal:e.target.value})} className="w-full p-2 border rounded">
                                                    <option>Bahía Blanca</option>
                                                    <option>Patagones</option>
                                                </select></div>
                                        </div>
                                        <div className="flex gap-2 mt-4">

                                            <button onClick={()=>setMostrarFormulario(false)} className="px-4 py-2 bg-gray-200 rounded-lg">Cancelar</button>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white rounded-xl shadow overflow-hidden">
                                    <div className="p-4 border-b flex justify-between items-center flex-wrap gap-2">
                                        <p className="text-sm text-gray-600">
                                            {registrosFiltrados.length === registros.length ? `${registros.length} registros` : `${registrosFiltrados.length} de ${registros.length}`}
                                            {` · Pág. ${paginaActual}/${totalPaginas}`}

                        {vistaActual === 'comparativo' && (
                            <>
                                {/* Interanual */}
                                <div className="bg-white p-6 rounded-xl shadow">
                                    <h3 className="text-xl font-bold mb-4">📅 Comparación Interanual</h3>
                                    {(() => {
                                        const añosData = Object.entries(datosComparativo.años)
                                            .map(([año,d]) => ({ año, ingresos:d.ingresos, servicios:d.servicios, clientas:d.clientas.size }))
                                            .sort((a,b)=>a.año.localeCompare(b.año));
                                        if (!añosData.length) return <p className="text-gray-500">Sin datos</p>;
                                        const mx = Math.max(...añosData.map(d=>d.ingresos));
                                        return (

                                        Object.values(datosComparativo.trimestres)
                                            .sort((a,b)=>a.año!==b.año?a.año.localeCompare(b.año):({Q1:1,Q2:2,Q3:3,Q4:4}[a.trimestre]-{Q1:1,Q2:2,Q3:3,Q4:4}[b.trimestre]))

                                        const hayDatos = Object.values(porQ).some(arr=>arr.length>0);

                                                                                    <span className="font-bold">{d.año}</span>

        // GENERADOR DE HISTORIAS PARA INSTAGRAM
        function GeneradorHistoriaIG({ reservas, horarios, setView }) {
            // Cargar configuración guardada
            const cargarConfig = () => {
                try {
                    const guardado = localStorage.getItem('historiaIGConfig');
                    return guardado ? JSON.parse(guardado) : null;
                } catch {
                    return null;
                }
            };
            
            const configGuardada = cargarConfig();
            
            const [sucursalId, setSucursalId] = useState(configGuardada?.sucursalId || 1);
            const [fechaInicio, setFechaInicio] = useState(() => {
                if (configGuardada?.fechaInicio) return configGuardada.fechaInicio;
                const hoy = new Date();
                return hoy.toISOString().split('T')[0];
            });
            const [fechaFin, setFechaFin] = useState(() => {
                if (configGuardada?.fechaFin) return configGuardada.fechaFin;
                const fin = new Date();
                fin.setDate(fin.getDate() + 7);
                return fin.toISOString().split('T')[0];
            });
            const [backgroundIndex, setBackgroundIndex] = useState(configGuardada?.backgroundIndex || 0);
            const [opacidad, setOpacidad] = useState(configGuardada?.opacidad || 60);
            
            // Biblioteca de backgrounds - cargar guardados
            const [backgrounds, setBackgrounds] = useState(configGuardada?.backgrounds || [
                'https://images.unsplash.com/photo-1604654894610-df63bc536371?w=1080&h=1920&fit=crop',
                'https://images.unsplash.com/photo-1610992015732-2449b76344bc?w=1080&h=1920&fit=crop',
                'https://images.unsplash.com/photo-1519014816548-bf5fe059798b?w=1080&h=1920&fit=crop',
                'https://images.unsplash.com/photo-1632345031435-8727f6897d53?w=1080&h=1920&fit=crop',
                'https://images.unsplash.com/photo-1599948128020-9a44cd7b0206?w=1080&h=1920&fit=crop',
            ]);
            
            // Guardar configuración cuando cambia
            useEffect(() => {
                const config = {
                    sucursalId,
                    fechaInicio,
                    fechaFin,
                    backgroundIndex,
                    opacidad,
                    backgrounds
                };
                localStorage.setItem('historiaIGConfig', JSON.stringify(config));
            }, [sucursalId, fechaInicio, fechaFin, backgroundIndex, opacidad, backgrounds]);
            
            // Subir fondo personalizado
            const subirFondo = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const nuevosBackgrounds = [...backgrounds, event.target.result];
                    setBackgrounds(nuevosBackgrounds);
                    setBackgroundIndex(backgrounds.length); // Seleccionar el nuevo fondo
                };
                reader.readAsDataURL(file);
            };
            
            // Eliminar fondo
            const eliminarFondo = (index) => {
                if (backgrounds.length <= 1) {
                    alert('Debe haber al menos 1 fondo');
                    return;
                }
                const nuevos = backgrounds.filter((_, i) => i !== index);
                setBackgrounds(nuevos);
                if (backgroundIndex >= nuevos.length) {
                    setBackgroundIndex(nuevos.length - 1);
                }
            };

            const sucursal = SUCURSALES.find(s => s.id === sucursalId);
            
            // Generar días para mostrar
            const generarDias = () => {
                const dias = [];
                
                // Crear fechas sin problemas de timezone
                const [yInicio, mInicio, dInicio] = fechaInicio.split('-').map(Number);
                const [yFin, mFin, dFin] = fechaFin.split('-').map(Number);
                const inicio = new Date(yInicio, mInicio - 1, dInicio);
                const fin = new Date(yFin, mFin - 1, dFin);
                
                // Iterar desde fecha inicio hasta fecha fin
                const fechaActual = new Date(inicio);
                while (fechaActual <= fin) {
                    // Obtener fecha en formato YYYY-MM-DD sin timezone
                    const y = fechaActual.getFullYear();
                    const m = String(fechaActual.getMonth() + 1).padStart(2, '0');
                    const d = String(fechaActual.getDate()).padStart(2, '0');
                    const fechaStr = `${y}-${m}-${d}`;
                    
                    // Obtener horarios configurados para este día
                    const horariosDia = horarios[sucursalId]?.[fechaStr];
                    
                    if (horariosDia && horariosDia.activo) {
                        const horasConfig = horariosDia.horas || [];
                        
                        // Filtrar horas ocupadas
                        const horasDisponibles = horasConfig.filter(hora => {
                            // Verificar si hay reserva en este horario
                            const ocupado = reservas.some(r => {
                                if (r.estado === 'cancelada') return false;
                                if (r.sucursal.id !== sucursalId) return false;
                                
                                // Parsear fecha de reserva sin timezone (formato YYYY-MM-DD)
                                const fechaReserva = r.fecha; // Ya está en formato YYYY-MM-DD
                                if (fechaReserva !== fechaStr) return false;
                                
                                // Verificar si este turno está bloqueado
                                const turnoKey = `${fechaStr}|${hora}`;
                                return r.turnosBloqueados?.includes(turnoKey);
                            });
                            return !ocupado;
                        });
                        
                        // Marcar horas ocupadas con corazón
                        const horasConEstado = horasConfig.map(hora => ({
                            hora,
                            ocupado: !horasDisponibles.includes(hora)
                        }));
                        
                        dias.push({
                            fecha: new Date(fechaActual),
                            dia: fechaActual.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric' }).toUpperCase(),
                            horas: horasConEstado
                        });
                    }
                    
                    // Avanzar al siguiente día
                    fechaActual.setDate(fechaActual.getDate() + 1);
                }
                
                return dias; // Mostrar todos los días del rango seleccionado
            };
            
            const dias = generarDias();
            
            const descargarImagen = () => {
                const canvas = document.getElementById('historia-canvas');
                const link = document.createElement('a');
                link.download = `historia-${sucursal.nombre}-${new Date().toISOString().split('T')[0]}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            
            useEffect(() => {
                const canvas = document.getElementById('historia-canvas');
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const width = 1080;
                const height = 1920;
                
                canvas.width = width;
                canvas.height = height;
                
                // Cargar imagen de fondo
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = backgrounds[backgroundIndex];
                
                img.onload = () => {
                    // Dibujar fondo
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Overlay semi-transparente más oscuro para mejor contraste
                    ctx.fillStyle = `rgba(0, 0, 0, ${(100 - opacidad) / 100})`;
                    ctx.fillRect(0, 0, width, height);
                    
                    // HEADER - Ubicación y mes
                    ctx.fillStyle = 'white';
                    ctx.textAlign = 'center';
                    
                    // Ubicación
                    ctx.font = 'bold 42px Arial';
                    ctx.fillText(`📍 ${sucursal.nombre}`, width / 2, 150);
                    
                    // Mes
                    ctx.font = 'bold 64px Arial';
                    const mes = new Date().toLocaleDateString('es-AR', { month: 'long' }).toUpperCase();
                    ctx.fillText(mes, width / 2, 240);
                    
                    // Línea decorativa
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(200, 270);
                    ctx.lineTo(880, 270);
                    ctx.stroke();
                    
                    // DÍAS Y HORARIOS
                    let y = 350;
                    const totalDias = dias.length;
                    const espacioMinimo = 100; // Espacio mínimo entre fin de horarios y siguiente día
                    
                    for (let d = 0; d < totalDias; d++) {
                        const dia = dias[d];
                        
                        // Nombre del día
                        ctx.font = 'bold 48px Arial';
                        ctx.fillStyle = 'white';
                        ctx.fillText(dia.dia, width / 2, y);
                        y += 70;
                        
                        // Horarios - máximo 5 por línea
                        const horasPorLinea = 5;
                        const lineas = [];
                        for (let i = 0; i < dia.horas.length; i += horasPorLinea) {
                            lineas.push(dia.horas.slice(i, i + horasPorLinea));
                        }
                        
                        // Dibujar cada línea de horarios
                        lineas.forEach((lineaHoras, indexLinea) => {
                            ctx.font = 'bold 38px Arial';
                            const totalHoras = lineaHoras.length;
                            const espacioEntre = 150;
                            const anchoTotal = (totalHoras - 1) * espacioEntre;
                            let x = (width - anchoTotal) / 2;
                            
                            lineaHoras.forEach(h => {
                                if (h.ocupado) {
                                    // Hora semi-transparente detrás
                                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                                    ctx.fillText(h.hora, x, y);
                                    
                                    // Corazón encima
                                    ctx.fillStyle = 'white';
                                    ctx.font = 'bold 48px Arial';
                                    ctx.fillText('❤️', x, y);
                                    ctx.font = 'bold 38px Arial';
                                } else {
                                    // Hora disponible
                                    ctx.fillStyle = 'white';
                                    ctx.fillText(h.hora, x, y);
                                }
                                x += espacioEntre;
                            });
                            
                            y += 65; // Espacio entre líneas de horarios del mismo día
                        });
                        
                        // Agregar espacio fijo para el siguiente día (desde donde terminamos)
                        y += espacioMinimo;
                    }
                    
                    // FOOTER - Espacio reservado (más compacto)
                    const footerY = 1850;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.fillRect(150, footerY, width - 300, 50);
                    
                    // Placeholder más discreto
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.font = '28px Arial';
                    ctx.fillText('(Espacio para sticker de enlace)', width / 2, footerY + 35);
                };
            }, [sucursalId, fechaInicio, fechaFin, backgroundIndex, opacidad, dias]);
            
            return (
                <div className="min-h-screen bg-gray-100 p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-6 flex items-center justify-between">
                            <h1 className="text-3xl font-bold">📸 Generador de Historia IG</h1>
                            <button onClick={() => setView('admin')} className="px-4 py-2 bg-gray-200 rounded-lg">← Volver</button>
                        </div>
                        
                        <div className="grid md:grid-cols-2 gap-6">
                            {/* Controles */}
                            <div className="bg-white rounded-xl shadow p-6 space-y-6">
                                <div>
                                    <label className="block font-semibold mb-2">📍 Sucursal</label>
                                    <select value={sucursalId} onChange={(e) => setSucursalId(parseInt(e.target.value))}
                                        className="w-full p-3 border-2 rounded-lg text-base">
                                        {SUCURSALES.map(s => (
                                            <option key={s.id} value={s.id}>{s.nombre}</option>
                                        ))}
                                    </select>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block font-semibold mb-2">📅 Desde</label>
                                        <input type="date" value={fechaInicio}
                                            onChange={(e) => setFechaInicio(e.target.value)}
                                            className="w-full p-3 border-2 rounded-lg" />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-2">📅 Hasta</label>
                                        <input type="date" value={fechaFin}
                                            onChange={(e) => setFechaFin(e.target.value)}
                                            className="w-full p-3 border-2 rounded-lg" />
                                    </div>
                                </div>
                                {dias.length === 0 && (
                                    <div className="bg-yellow-50 border-l-4 border-yellow-500 p-3 text-sm text-yellow-800">
                                        ⚠️ No hay horarios configurados para este rango de fechas
                                    </div>
                                )}
                                {dias.length > 6 && (
                                    <div className="bg-blue-50 border-l-4 border-blue-500 p-3 text-sm text-blue-800">
                                        ℹ️ Con muchos días, el espaciado se ajusta automáticamente. Recomendamos máximo 5 días para mejor legibilidad.
                                    </div>
                                )}
                                
                                <div>
                                    <label className="block font-semibold mb-2">🖼️ Fondo</label>
                                    <div className="grid grid-cols-3 gap-3 mb-3">
                                        {backgrounds.map((bg, i) => (
                                            <div key={i} className="relative">
                                                <button
                                                    onClick={() => setBackgroundIndex(i)}
                                                    className={`aspect-[9/16] rounded-lg overflow-hidden border-4 w-full ${
                                                        backgroundIndex === i ? 'border-pink-500' : 'border-gray-200'
                                                    }`}>
                                                    <img src={bg} alt={`Fondo ${i + 1}`} className="w-full h-full object-cover" />
                                                </button>
                                                {backgrounds.length > 1 && (
                                                    <button
                                                        onClick={() => eliminarFondo(i)}
                                                        className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs font-bold hover:bg-red-600">
                                                        ×
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <label className="block w-full p-3 border-2 border-dashed border-gray-300 rounded-lg text-center cursor-pointer hover:border-pink-500 hover:bg-pink-50 transition-colors">
                                        <span className="text-sm">+ Subir tu propia foto</span>
                                        <input type="file" accept="image/*" onChange={subirFondo} className="hidden" />
                                    </label>
                                </div>
                                
                                <div>
                                    <label className="block font-semibold mb-2">🎨 Opacidad del fondo: {opacidad}%</label>
                                    <input type="range" min="0" max="100" value={opacidad}
                                        onChange={(e) => setOpacidad(parseInt(e.target.value))}
                                        className="w-full" />

                                </div>
                                
                                <button onClick={descargarImagen}
                                    className="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white py-4 rounded-xl font-bold text-lg">

                                <div className="bg-blue-50 border-l-4 border-blue-500 p-4 text-sm">

                                        <strong>💡 Tip:</strong> Los corazones ❤️ muestran turnos ocupados (se ve el horario detrás). Al publicar en Instagram, agregá un sticker de enlace en el footer. Tu configuración (fechas, fondos) se guarda automáticamente.
                                    </p>

                            </div>
                            
                            {/* Preview */}
                            <div className="bg-white rounded-xl shadow p-6">
                                <h2 className="font-bold mb-4 text-center">Preview (escala reducida)</h2>
                                <div className="flex justify-center">

                1: {}, // Bahía Blanca - se llenará dinámicamente

                    setView('confirmar-reserva');

                const cargarDatos = async () => {

                        const config = await FirebaseDB.get('configuracion');

                            if (config.servicios) {
                                // Ordenar servicios para que "Todavía no me decido" siempre esté al final
                                const serviciosOrdenados = config.servicios.sort((a, b) => {
                                    if (a.esIndeciso) return 1;
                                    if (b.esIndeciso) return -1;
                                    return a.id - b.id;
                                });
                                setServicios(serviciosOrdenados);
                            }
                            if (config.seña) setSeñaFija(config.seña);
                            if (config.linkMPago) setLinkMPago(config.linkMPago);
                            if (config.telAdmin) setTelAdmin(config.telAdmin);
                            if (config.horarios) setHorarios(config.horarios);
                            if (config.password) setPassword(config.password);
                        } else {
                            // Primera vez - guardar defaults
                            await FirebaseDB.set('configuracion', {
                                servicios: DEFAULT_SERVICIOS,
                                seña: 2000,
                                linkMPago: 'https://mpago.la/2SL1Ew9',
                                telAdmin: '5492920601373',
                                horarios: { 1: {}, 2: {} },
                                password: 'admin123'
                            });
                        }

                        // Cargar reservas
                        const reservas = await FirebaseDB.get('reservas');
                        if (reservas) {
                            setReservas(Object.values(reservas));
                        }

                        // Escuchar cambios en tiempo real
                        FirebaseDB.listen('configuracion', (data) => {
                            if (data) {
                                if (data.servicios) setServicios(data.servicios);
                                if (data.seña) setSeñaFija(data.seña);
                                if (data.linkMPago) setLinkMPago(data.linkMPago);
                                if (data.telAdmin) setTelAdmin(data.telAdmin);
                                if (data.horarios) setHorarios(data.horarios);
                            }
                        });

                        FirebaseDB.listen('reservas', (data) => {
                            if (data) {
                                setReservas(Object.values(data));
                            } else {
                                setReservas([]);
                            }
                        });

                    } catch (error) {
                        console.error('Error cargando datos:', error);

                    }
                };

                cargarDatos();

                return () => {

                                reg.importe === r.servicios.reduce((sum, s) => sum + s.precio, 0)
                            );
                            
                            return !yaExiste;

                </div>
            );
        }

        // VISTA CLIENTE
        function ClientView({ agregarReserva, setView, servicios, señaFija, horarios, reservas }) {
            const [paso, setPaso] = useState(1);
            const [final, setFinal] = useState(null);
            const [cargando, setCargando] = useState(false);
            const [horaPreferida, setHoraPreferida] = useState('');
            const [mostrarCalendario, setMostrarCalendario] = useState(false);
            const [sel, setSel] = useState({
                sucursal: null,
                servicios: [],
                fecha: null,
                hora: null,
                cliente: { nombre: '', telefono: '+54 9 ' }
            });
            
            const cambiarPaso = (nuevoPaso) => {
                if (nuevoPaso !== 3) {
                    setHoraPreferida('');
                    setMostrarCalendario(false);
                }
                setPaso(nuevoPaso);
                window.scrollTo(0, 0);
            };

            const toggleServicio = (s) => {
                if (s.esIndeciso) {
                    setSel({...sel, servicios: [s]});
                    return;
                }
                let servs = sel.servicios.filter(x => !x.esIndeciso);
                const existe = servs.find(x => x.id === s.id);
                if (existe) {
                    servs = servs.filter(x => x.id !== s.id);
                } else {
                    servs.push(s);
                }
                setSel({...sel, servicios: servs});
            };

            if (final) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-blue-100">
                        <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
                            <div className="text-6xl mb-4">✅</div>
                            <h2 className="text-3xl font-bold mb-2">¡Reserva Recibida!</h2>
                            <p className="text-gray-600 mb-6">Te enviaremos un WhatsApp con los datos de pago</p>
                            <div className="bg-pink-50 rounded-xl p-4 mb-6">
                                <p className="font-bold">{final.cliente.nombre}</p>
                                <p className="text-sm">{final.servicios.map(s => s.nombre).join(', ')}</p>
                                <p className="text-sm text-gray-600 mt-2">{final.sucursal.nombre}</p>
                                <p className="text-sm text-gray-600">{new Date(final.fecha).toLocaleDateString('es-AR')} - {final.hora}</p>
                                <p className="text-2xl font-bold text-green-600 mt-3">Seña: ${señaFija}</p>
                            </div>
                            <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 text-left text-sm">
                                <p className="text-blue-900">
                                    <strong>📱 Próximos pasos:</strong><br/>
                                    • Recibirás un WhatsApp con el link de pago<br/>
                                    • Pagá la seña y subí el comprobante<br/>
                                    • ¡Listo! Tu turno quedará confirmado
                                </p>
                            </div>
                            <button onClick={() => { setFinal(null); cambiarPaso(1); setSel({...sel, servicios:[]}); }}
                                className="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-4 rounded-xl font-semibold">
                                Cerrar
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100">

                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">

                                            <button key={s.id} onClick={() => toggleServicio(s)}
                                                className={`w-full p-6 rounded-xl shadow transition-all text-left border-2 ${

                                <h2 className="text-3xl font-bold mb-2">Elegí fecha y hora</h2>
                                <p className="text-gray-600 mb-8">Encontrá el mejor horario para vos</p>
                                
                                <div className="bg-white p-6 rounded-2xl shadow-lg max-w-4xl mx-auto space-y-6">
                                    
                                    {/* SELECCIÓN DE FECHA */}
                                    {!sel.fecha && (
                                        <div>
                                            <h3 className="font-semibold text-lg mb-4">📅 Días disponibles:</h3>
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                                {(() => {
                                                    const dias = [];
                                                    for (let i = 0; i < 28; i++) {
                                                        const d = new Date();
                                                        d.setDate(d.getDate() + i);
                                                        const y = d.getFullYear();
                                                        const m = String(d.getMonth()+1).padStart(2,'0');
                                                        const day = String(d.getDate()).padStart(2,'0');
                                                        const fechaStr = `${y}-${m}-${day}`;
                                                        const config = horarios[sel.sucursal.id]?.[fechaStr];
                                                        if (config && config.horas && config.horas.length > 0) {
                                                            dias.push({ fechaStr, label: d.toLocaleDateString('es-AR', {weekday:'short', day:'numeric', month:'short'}) });
                                                        }
                                                    }
                                                    if (dias.length === 0) return <p className="text-gray-500 col-span-3">No hay turnos disponibles en los próximos 28 días.</p>;
                                                    return dias.map(dia => (
                                                        <button key={dia.fechaStr}
                                                            onClick={() => setSel({...sel, fecha: dia.fechaStr, hora: null})}
                                                            className="p-4 bg-green-50 hover:bg-green-100 border-2 border-green-300 rounded-xl text-left transition-all">
                                                            <div className="font-bold text-green-800">{dia.label}</div>
                                                        </button>
                                                    ));
                                                })()}
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* SELECCIÓN DE HORA */}
                                    {sel.fecha && (
                                        <div>

                                            <div className="bg-blue-50 rounded-xl p-4 mb-4">
                                                <p className="font-semibold">📅 {(() => { const [y,m,d] = sel.fecha.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'}); })()}</p>
                                                <p className="text-sm text-gray-600 mt-1">⏱️ Duración: {sel.servicios.reduce((s,sv)=>s+sv.duracion,0)} min</p>
                                            </div>
                                            
                                            {(() => {
                                                const horario = horarios[sel.sucursal.id]?.[sel.fecha];
                                                const horasConf = horario?.horas || [];
                                                const duracion = sel.servicios.reduce((s,sv)=>s+sv.duracion,0);
                                                
                                                const horasDisp = horasConf.filter(hora => {
                                                    const bloqueados = calcularTurnosBloqueados(sel.fecha, hora, duracion);
                                                    return !reservas.some(r => {
                                                        if (r.estado === 'cancelada') return false;
                                                        if (r.sucursal.id !== sel.sucursal.id) return false;
                                                        if (r.fecha !== sel.fecha) return false;
                                                        return r.turnosBloqueados?.some(tb => bloqueados.includes(tb));
                                                    });
                                                });
                                                
                                                if (horasDisp.length === 0) return (
                                                    <div className="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded">
                                                        <p className="text-yellow-800 font-semibold">⚠️ Sin turnos disponibles este día</p>
                                                        <p className="text-yellow-700 text-sm mt-1">Por favor elegí otra fecha.</p>
                                                    </div>
                                                );
                                                
                                                return (
                                                    <div>
                                                        <label className="block text-sm font-semibold mb-3">⏰ Elegí tu horario:</label>
                                                        <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                                                            {horasDisp.map(hora => (
                                                                <button key={hora}
                                                                    onClick={() => setSel({...sel, hora})}
                                                                    className={`p-3 rounded-lg font-semibold transition-all ${sel.hora === hora ? 'bg-blue-600 text-white shadow-lg' : 'bg-gray-100 hover:bg-blue-100 hover:text-blue-600'}`}>
                                                                    {hora}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })()}
                                            
                                            {sel.fecha && sel.hora && (
                                                <button onClick={() => cambiarPaso(4)}
                                                    className="w-full mt-6 bg-gradient-to-r from-blue-600 to-blue-700 text-white py-4 rounded-xl font-bold text-lg">
                                                    Continuar →
                                                </button>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        {paso === 4 && (

                                <button onClick={() => cambiarPaso(3)} className="mb-6 text-blue-600">← Volver</button>
                                <h2 className="text-3xl font-bold mb-8">Completá tus datos</h2>

                                        onChange={(e) => setSel({...sel, cliente:{...sel.cliente, nombre:e.target.value}})}

                                                className="flex-1 p-4 outline-none font-mono"

                                                onChange={(e) => {
                                                    const numeros = e.target.value.replace(/\D/g, '');

                                            />
                                        </div>
                                        <p className="text-xs text-gray-500 mt-1">Sin 0, guiones ni espacios. Ej: 291 1234567</p>
                                    </div>
                                    <button onClick={async () => {
                                            if (!sel.cliente.nombre.trim()) return alert('⚠️ Ingresá tu nombre');

                                        className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">
                                        Crear Pre-Reserva
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ADMIN PANEL
        function AdminPanel({ reservas, guardarReservas, enviarLinkPago, enviarRecordatorio, enviarConfirmacion, setView, isLoggedIn, setIsLoggedIn, password }) {
            const [pass, setPass] = useState('');

                            beep.play().catch(() => {});
                        } catch(e) {}

                        // Actualizar último chequeo
                        setUltimoChequeo(Date.now());
                    }
                }, 15000); // Cada 15 segundos

                return () => clearInterval(intervalo);
            }, [reservas, isLoggedIn, ultimoChequeo]);

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">

            const confirmar = (id) => {
                const reserva = reservas.find(r => r.id === id);
                const nuevas = reservas.map(r => r.id === id ? {...r, estado:'confirmada'} : r);

            const eliminar = (id) => {

            const limpiarTodasLasReservas = () => {

            // Nueva función: Eliminar reservas por estado
            const eliminarPorEstado = (estado) => {
                const aEliminar = reservas.filter(r => r.estado === estado);
                const nombreEstado = estado === 'cancelada' ? 'canceladas' : estado === 'pendiente' ? 'pendientes' : 'confirmadas';
                
                if (aEliminar.length === 0) {
                    alert(`No hay reservas ${nombreEstado} para eliminar`);

                if (confirm(`⚠️ ¿ELIMINAR TODAS LAS RESERVAS ${nombreEstado.toUpperCase()}?\n\nSe eliminarán ${aEliminar.length} reservas.\n\n¡Esta acción NO se puede deshacer!`)) {

                    alert(`✅ ${aEliminar.length} reservas ${nombreEstado} eliminadas`);

            // Nueva función: Eliminar por rango de fechas
            const eliminarPorRangoFechas = () => {
                const fechaInicio = prompt('Fecha inicio (YYYY-MM-DD):');
                if (!fechaInicio) return;
                
                const fechaFin = prompt('Fecha fin (YYYY-MM-DD):');
                if (!fechaFin) return;
                
                // Validar formato de fechas
                const regexFecha = /^\d{4}-\d{2}-\d{2}$/;
                if (!regexFecha.test(fechaInicio) || !regexFecha.test(fechaFin)) {
                    alert('❌ Formato de fecha inválido. Usa YYYY-MM-DD (ejemplo: 2026-02-16)');
                    return;
                }
                
                const aEliminar = reservas.filter(r => r.fecha >= fechaInicio && r.fecha <= fechaFin);
                
                if (aEliminar.length === 0) {
                    alert(`No hay reservas entre ${fechaInicio} y ${fechaFin}`);
                    return;

                if (confirm(`⚠️ ¿ELIMINAR RESERVAS DEL RANGO?\n\nDesde: ${fechaInicio}\nHasta: ${fechaFin}\nTotal: ${aEliminar.length} reservas\n\n¡Esta acción NO se puede deshacer!`)) {
                    const nuevas = reservas.filter(r => r.fecha < fechaInicio || r.fecha > fechaFin);

            // Nueva función: Eliminar reservas antiguas (anteriores a una fecha)

                // Validar formato de fecha
                const regexFecha = /^\d{4}-\d{2}-\d{2}$/;
                if (!regexFecha.test(fecha)) {
                    alert('❌ Formato de fecha inválido. Usa YYYY-MM-DD (ejemplo: 2026-02-16)');
                    return;
                }
                
                const aEliminar = reservas.filter(r => r.fecha < fecha);
                
                if (aEliminar.length === 0) {
                    alert(`No hay reservas anteriores a ${fecha}`);
                    return;
                }
                
                if (confirm(`⚠️ ¿ELIMINAR RESERVAS ANTIGUAS?\n\nSe eliminarán todas las reservas anteriores a ${fecha}\nTotal: ${aEliminar.length} reservas\n\n¡Esta acción NO se puede deshacer!`)) {
                    const nuevas = reservas.filter(r => r.fecha >= fecha);

                    alert(`✅ ${aEliminar.length} reservas antiguas eliminadas`);

            // Nueva función: Mostrar menú de eliminación masiva
            const mostrarMenuEliminacion = () => {
                const opciones = `Opciones de eliminación masiva:

1️⃣ Eliminar todas las canceladas
2️⃣ Eliminar todas las pendientes
3️⃣ Eliminar todas las confirmadas
4️⃣ Eliminar por rango de fechas
5️⃣ Eliminar reservas anteriores a una fecha
6️⃣ Eliminar TODAS las reservas

Ingresá el número de la opción (1-6):`;
                
                const opcion = prompt(opciones);
                
                switch(opcion) {
                    case '1':
                        eliminarPorEstado('cancelada');
                        break;
                    case '2':
                        eliminarPorEstado('pendiente');
                        break;
                    case '3':
                        eliminarPorEstado('confirmada');
                        break;
                    case '4':
                        eliminarPorRangoFechas();
                        break;
                    case '5':
                        eliminarAnterioresA();
                        break;
                    case '6':

                        break;
                    default:

                        break;

            const pendientes = reservas.filter(r => r.estado === 'pendiente' && !r.comprobante);

            return (

                    <div className="max-w-7xl mx-auto p-4 space-y-6">

                                {filtro === 'todas' && <p className="text-xs text-blue-600 mt-1">● Mostrando todas</p>}
                            </button>
                            <button

                            </button>

                                                    className="px-4 py-2 bg-blue-500 text-white rounded-lg font-semibold hover:bg-blue-600">
                                                    👁️ Ver
                                                </button>
                                                <button onClick={() => confirmar(r.id)}
                                                    className="px-4 py-2 bg-green-500 text-white rounded-lg font-semibold hover:bg-green-600">
                                                    ✓ Confirmar
                                                </button>
                                                <button onClick={() => eliminar(r.id)}
                                                    className="px-4 py-2 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600">
                                                    🗑️
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {pendientes.length > 0 && (

                                <div className="space-y-3">
                                    {pendientes.map(r => (
                                        <div key={r.id} className="bg-white rounded-lg p-4 flex justify-between items-center">
