        // Funciones helper para Firebase
        const FirebaseDB = {
            // Leer datos
            async get(path) {
                try {
                    const snapshot = await db.ref(path).once('value');
                    return snapshot.val();
                } catch (error) {
                    console.error('Error leyendo:', error);
                    return null;
                }
            },
            
            // Guardar datos
            async set(path, data) {
                try {
                    await db.ref(path).set(data);
                    return true;
                } catch (error) {
                    console.error('Error guardando:', error);
                    return false;
                }
            },
            
            // Escuchar cambios en tiempo real
            listen(path, callback) {
                db.ref(path).on('value', (snapshot) => {
                    callback(snapshot.val());
                });
            },
            
            // Dejar de escuchar
            unlisten(path) {
                db.ref(path).off();
            }
        };

        // Ocultar loading cuando React carga
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        });
        const { useState, useEffect, useRef } = React;

        // Configuración por defecto
        const SUCURSALES = [

        const DEFAULT_SERVICIOS = [

            { id: 0, nombre: "Todavía no me decido", duracion: 60, precio: 0, esIndeciso: true }
        ];

        // Función global para calcular qué turnos se deben bloquear
        const calcularTurnosBloqueados = (fecha, horaInicio, duracionMinutos) => {
            const bloqueados = [];
            const fechaStr = new Date(fecha).toISOString().split('T')[0];
            
            // Convertir hora inicio a minutos desde medianoche
            const [h, m] = horaInicio.split(':').map(Number);
            let minutosInicio = h * 60 + m;
            const minutosFin = minutosInicio + duracionMinutos;
            
            // Generar todos los turnos de 30 minutos que quedan bloqueados
            while (minutosInicio < minutosFin) {
                const horas = Math.floor(minutosInicio / 60);
                const mins = minutosInicio % 60;
                const horaStr = `${horas.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
                bloqueados.push(`${fechaStr}|${horaStr}`);
                minutosInicio += 30; // Bloques de 30 minutos
            }
            
            return bloqueados;
        };

        // Función global para enviar email de comprobante
        const enviarEmailComprobanteGlobal = (reserva, comprobanteBase64, señaFija) => {
            if (typeof emailjs === 'undefined') {
                console.log('EmailJS no cargado');
                return;
            }

            const servs = reserva.servicios.map(s => s.nombre).join('\n• ');
            const total = reserva.servicios.reduce((sum, s) => sum + s.precio, 0);
            const tel = reserva.cliente.telefono.replace(/\D/g, '');
            
            // Link para confirmar la reserva desde el email
            const baseUrl = window.location.origin;
            const confirmarLink = `${baseUrl}?confirmar=${reserva.id}`;
            
            // Mensaje de WhatsApp de confirmación
            const resto = total - señaFija;
            const mensajeConfirmacion = `✅ *TURNO CONFIRMADO* ✅

¡Hola ${reserva.cliente.nombre}! 🎉

Tu pago fue verificado y tu turno está *100% confirmado* 💖

📋 *RECORDÁ TUS DATOS:*
📍 Sucursal: ${reserva.sucursal.nombre}
📅 Fecha: ${new Date(reserva.fecha).toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'})}
⏰ Hora: ${reserva.hora}

• ${servs}

💰 Total del servicio: $${total}
✅ Seña pagada: $${señaFija}
💸 Resto a pagar en el local: $${resto}

Te enviaré un recordatorio el día anterior.

¡Te esperamos! 😊✨`;

            const whatsappConfirmarLink = `https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(mensajeConfirmacion).replace(/%20/g, '+')}`;
            const panelLink = `${baseUrl}`;

            // Parámetros para el template
            const templateParams = {
                to_email: 'aldi.arteenunas@gmail.com',
                cliente_nombre: reserva.cliente.nombre,
                cliente_telefono: reserva.cliente.telefono,
                servicios: servs,
                sucursal: reserva.sucursal.nombre,
                fecha: new Date(reserva.fecha).toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'}),
                hora: reserva.hora,
                total: total,
                seña: señaFija,
                comprobante_img: comprobanteBase64,
                whatsapp_link: whatsappConfirmarLink,
                confirmar_link: confirmarLink,
                panel_link: panelLink,
                reserva_id: reserva.id
            };

            // Enviar email con template de comprobante
            emailjs.send('service_aldi', 'template_comprobante', templateParams, 'fYtFNacCUxWEinU5x')
                .then(() => {
                    console.log('✅ Email comprobante enviado');
                })
                .catch((error) => {
                    console.error('❌ Error enviando email comprobante:', error);
                });
        };

        // CALENDARIO DE TURNOS - Vista simple para verificar disponibilidad
        function CalendarioTurnos({ reservas, horarios, setView, guardarReservas }) {
            const [sucursalId, setSucursalId] = useState(1);
            const [fechaSeleccionada, setFechaSeleccionada] = useState(() => {
                return new Date().toISOString().split('T')[0];
            });
            
            const sucursal = SUCURSALES.find(s => s.id === sucursalId);
            
            // Ocupar turno manualmente (ficticio)
            const ocuparTurnoManual = (fecha, hora) => {
                if (!confirm(`¿Ocupar el turno ${hora} del ${fecha}?\n\nEsto bloqueará el turno pero NO creará una reserva real.`)) {
                    return;
                }
                
                const reservaFicticia = {
                    id: Date.now(),
                    cliente: { nombre: 'Turno Bloqueado', telefono: '-', email: '-' },
                    servicios: [{ id: 0, nombre: 'Bloqueado manualmente', duracion: 30, precio: 0 }],
                    fecha: fecha,
                    hora: hora,
                    sucursal: sucursal,
                    estado: 'confirmada',
                    fechaCreacion: new Date().toISOString(),
                    duracionTotal: 30,
                    turnosBloqueados: [`${fecha}|${hora}`],
                    esFicticia: true // Marcador para identificarla
                };
                
                const nuevas = [...reservas, reservaFicticia];
                guardarReservas(nuevas);
                alert('✅ Turno ocupado manualmente');
            };
            
            // Generar días para mostrar (7 días desde hoy)
            const generarDias = () => {
                const dias = [];
                const hoy = new Date();
                
                for (let i = 0; i < 14; i++) {
                    const fecha = new Date(hoy);
                    fecha.setDate(hoy.getDate() + i);
                    
                    const y = fecha.getFullYear();
                    const m = String(fecha.getMonth() + 1).padStart(2, '0');
                    const d = String(fecha.getDate()).padStart(2, '0');
                    const fechaStr = `${y}-${m}-${d}`;
                    
                    const horariosDia = horarios[sucursalId]?.[fechaStr];
                    
                    dias.push({
                        fecha: fechaStr,
                        fechaObj: new Date(fecha),
                        activo: horariosDia?.activo || false,
                        horas: horariosDia?.horas || []
                    });
                }
                
                return dias;
            };
            
            const dias = generarDias();
            const diaSeleccionado = dias.find(d => d.fecha === fechaSeleccionada);
            
            // Obtener estado de cada hora
            const obtenerEstadoHora = (hora) => {
                const turnoKey = `${fechaSeleccionada}|${hora}`;
                
                // Buscar reservas que bloquean este turno
                const reservasEnEsteTurno = reservas.filter(r => {
                    if (r.estado === 'cancelada') return false;
                    if (r.sucursal.id !== sucursalId) return false;
                    return r.turnosBloqueados?.includes(turnoKey);
                });
                
                if (reservasEnEsteTurno.length === 0) {
                    return { estado: 'libre', reserva: null };
                }
                
                return { 
                    estado: 'ocupado', 
                    reserva: reservasEnEsteTurno[0] // Primera reserva que bloquea
                };
            };
            
            return (
                <div className="min-h-screen bg-gray-100 p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-6 flex items-center justify-between">
                            <h1 className="text-3xl font-bold">📅 Calendario de Turnos</h1>
                            <button onClick={() => setView('admin')} className="px-4 py-2 bg-gray-200 rounded-lg">← Volver</button>
                        </div>
                        
                        {/* Selector de sucursal */}
                        <div className="bg-white rounded-xl shadow p-6 mb-6">
                            <label className="block font-semibold mb-2">📍 Sucursal</label>
                            <select value={sucursalId} onChange={(e) => setSucursalId(parseInt(e.target.value))}
                                className="w-full md:w-64 p-3 border-2 rounded-lg text-base">

        // PANEL DE ANÁLISIS CON FIREBASE Y EXCEL
        function PanelAnalisis({ reservas, servicios, setView }) {

            // Cargar desde Firebase
            useEffect(() => {

                    try {
                        const data = await FirebaseDB.get('registrosIngresos');
                        setRegistros(data || []);
                    } catch (error) {
                        console.error('Error cargando registros:', error);
                        setRegistros([]);
                    }
                    setCargando(false);
                };
                cargar();
            }, []);
            
            // Guardar en Firebase
            const guardarRegistros = async (nuevos) => {
                setRegistros(nuevos);
                try {
                    await FirebaseDB.set('registrosIngresos', nuevos);
                } catch (error) {
                    console.error('Error guardando registros:', error);
                    alert('❌ Error al guardar. Intentá de nuevo.');
                }
            };
            
            // Lista única de clientas para autocomplete
            const clientasUnicas = [...new Set(registros.map(r => r.clienta).filter(c => c))].sort();

            const abrirEditor = (registro) => {
                setEditando(registro.id);

                    servicios: registro.servicios || [],
                    importe: registro.importe || 0,
                    metodoPago: registro.metodoPago || 'efectivo',
                    sucursal: registro.sucursal || 'Bahía Blanca',
                    notas: registro.notas || ''
                });
            };
            
            // Guardar edición
            const guardarEdicion = () => {
                if (!formEdit.clienta) {
                    alert('⚠️ Completá el nombre del cliente');

                if (formEdit.servicios.length === 0) {
                    alert('⚠️ Seleccioná al menos un servicio');
                    return;

                    r.id === editando

                        : r
                );

                setEditando(null);
                alert('✅ Registro actualizado');

                if (seleccionados.includes(id)) {

                } else {
                    setSeleccionados([...seleccionados, id]);
                }

            // Seleccionar todos filtrados
            const seleccionarTodos = () => {
                setSeleccionados(registrosFiltrados.map(r => r.id));

                setSeleccionados([]);

            // Eliminar seleccionados

                if (confirm(`⚠️ ¿ELIMINAR TODOS LOS ${registros.length} REGISTROS?\n\nEsta acción NO se puede deshacer.\n\nSe perderá TODO el historial.`)) {
                    if (confirm('¿Estás completamente seguro?\n\nÚltima advertencia antes de borrar todo.')) {
                        await guardarRegistros([]);
                        setSeleccionados([]);

            // Funciones de eliminación
            const eliminarUno = (id) => {
                if (confirm('¿Eliminar este registro?\n\nNo se puede deshacer.')) {
                    guardarRegistros(registros.filter(r => r.id !== id));
                    setSeleccionados(seleccionados.filter(s => s !== id));

            };
            
            const eliminarSeleccionados = () => {

            const eliminarTodos = () => {

                        setSeleccionados([]);

            const eliminarPendientes = () => {

            // Toggle selección
            const toggleSeleccion = (id) => {

                    setSeleccionados(seleccionados.filter(s => s !== id));

                    setSeleccionados([...seleccionados, id]);

            const toggleTodos = () => {
                if (seleccionados.length === registrosFiltrados.length) {
                    setSeleccionados([]);
                } else {
                    setSeleccionados(registrosFiltrados.map(r => r.id));

            // Agregar registro
            const agregarRegistro = () => {
                if (!nuevoRegistro.clienta || nuevoRegistro.servicios.length === 0) {

                const registro = {
                    ...nuevoRegistro,
                    id: Date.now(),
                    fechaCreacion: new Date().toISOString()
                };
                guardarRegistros([...registros, registro]);
                setNuevoRegistro({
                    fecha: new Date().toISOString().split('T')[0],

                    servicios: [],
                    importe: 0,
                    metodoPago: 'efectivo',

                });

                alert('✅ Registro agregado');
            };
            
            // Importar desde reservas confirmadas
            const importarDesdeReservas = () => {
                const confirmadas = reservas.filter(r => r.estado === 'confirmada' && !r.esFicticia);
                let importados = 0;
                const nuevos = [];
                
                confirmadas.forEach(r => {
                    const existe = registros.some(reg => 
                        reg.clienta === r.cliente.nombre && 
                        reg.fecha === r.fecha &&
                        reg.importe === r.servicios.reduce((sum, s) => sum + s.precio, 0)
                    );
                    
                    if (!existe) {
                        nuevos.push({
                            id: Date.now() + Math.random(),

                            clienta: r.cliente.nombre,

                            metodoPago: 'transferencia',

                        });
                        importados++;
                    }

                if (importados > 0) {
                    guardarRegistros([...registros, ...nuevos]);
                    alert(`✅ ${importados} registros importados desde reservas`);
                } else {
                    alert('No hay nuevas reservas para importar');
                }
            };
            
            // Filtrar registros
            const registrosFiltrados = registros.filter(r => {
                if (filtros.fechaInicio && r.fecha < filtros.fechaInicio) return false;
                if (filtros.fechaFin && r.fecha > filtros.fechaFin) return false;
                if (filtros.clienta && r.clienta && !r.clienta.toLowerCase().includes(filtros.clienta.toLowerCase())) return false;
                if (filtros.servicio && r.servicios && Array.isArray(r.servicios) && !r.servicios.some(s => s && s.toLowerCase().includes(filtros.servicio.toLowerCase()))) return false;
                if (filtros.metodoPago && r.metodoPago !== filtros.metodoPago) return false;
                if (filtros.sucursal && r.sucursal !== filtros.sucursal) return false;
                if (filtros.estado === 'normalizado' && !r.normalizado) return false;
                if (filtros.estado === 'pendiente' && r.normalizado) return false;
                return true;
            });
            
            // Estadísticas

                registrosFiltrados.forEach(r => {

                        const mes = r.fecha.substring(0, 7);
                        meses[mes] = (meses[mes] || 0) + (r.importe || 0);
                    }
                });
                return Object.entries(meses).sort((a, b) => a[0].localeCompare(b[0]));
            };
            
            // Exportar a Excel
            const exportarExcel = () => {

                    const wb = XLSX.utils.book_new();

                } catch (error) {

                    alert('❌ Error al exportar. Asegurate de tener datos para exportar.');
                }

                        // Importar desde Excel
            const importarExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(firstSheet, {raw: false});
                        
                        const nuevos = rows.map(row => {
                            // Mapear columnas
                            let fechaRaw = row.FECHA || row.Fecha || row.fecha || '';
                            const clienta = row.CLIENTE || row.Cliente || row.Clienta || row.clienta || '';
                            const servicio = row.SERVICIO || row.Servicio || row.Servicios || row.servicios || '';
                            const precio = parseFloat(row.PRECIO || row.Precio || row.Importe || row.importe) || 0;
                            const pago = (row.PAGO || row.Pago || row['Método Pago'] || row.metodoPago || 'efectivo').toString().toLowerCase();
                            
                            // PARSEAR FECHA - Varios formatos
                            let fecha = '';
                            if (fechaRaw) {
                                try {
                                    // Si viene como Date object
                                    if (fechaRaw instanceof Date) {
                                        fecha = fechaRaw.toISOString().split('T')[0];
                                    }
                                    // Si es string DD/MM/YYYY
                                    else if (typeof fechaRaw === 'string' && fechaRaw.includes('/')) {
                                        const partes = fechaRaw.split('/');
                                        if (partes.length === 3) {
                                            let dia = partes[0].padStart(2, '0');
                                            let mes = partes[1].padStart(2, '0');
                                            let anio = partes[2];
                                            if (anio.length === 2) anio = '20' + anio;
                                            fecha = `${anio}-${mes}-${dia}`;
                                        }
                                    }
                                    // Si es string YYYY-MM-DD
                                    else if (typeof fechaRaw === 'string' && fechaRaw.includes('-')) {
                                        fecha = fechaRaw;
                                    }
                                    // Si es string parseable
                                    else if (typeof fechaRaw === 'string') {
                                        const d = new Date(fechaRaw);
                                        if (!isNaN(d.getTime())) {
                                            fecha = d.toISOString().split('T')[0];
                                        }
                                    }
                                    // Si es número (serial de Excel)
                                    else if (typeof fechaRaw === 'number') {
                                        const d = new Date((fechaRaw - 25569) * 86400 * 1000);
                                        fecha = d.toISOString().split('T')[0];
                                    }
                                } catch (e) {
                                    console.error('Error parseando fecha:', fechaRaw, e);
                                }
                            }
                            
                            const normalizado = !!(clienta && servicio);
                            
                            return {
                                id: Date.now() + Math.random(),
                                fecha: fecha,
                                clienta: clienta,
                                servicios: servicio ? servicio.toString().split(',').map(s => s.trim()).filter(s => s) : [],
                                importe: precio,
                                metodoPago: pago,
                                sucursal: row.Sucursal || row.sucursal || 'Bahía Blanca',
                                notas: row.Notas || row.notas || 'Importado',
                                normalizado: normalizado,
                                fechaCreacion: new Date().toISOString()
                            };
                        }).filter(r => r.fecha && r.importe > 0);
                        
                        if (nuevos.length > 0) {

                        } else {} else {
                                            fecha = new Date(fechaRaw).toISOString().split('T')[0];
                                        }
                                    }
                                } catch (e) {
                                    console.error('Error parseando fecha:', fechaRaw, e);
                                    fecha = '';
                                }
                            }
                            
                            // Determinar si está normalizado (tiene cliente Y servicio)
                            const normalizado = !!(clienta && servicio);
                            
                            return {
                                id: Date.now() + Math.random(),
                                fecha: fecha,
                                clienta: clienta,
                                servicios: servicio ? servicio.toString().split(',').map(s => s.trim()).filter(s => s) : [],
                                importe: precio,
                                metodoPago: pago,
                                sucursal: row.Sucursal || row.sucursal || 'Bahía Blanca',
                                notas: row.Notas || row.notas || 'Importado de Excel',
                                normalizado: normalizado,
                                fechaCreacion: new Date().toISOString()
                            };
                        }).filter(r => r.fecha && r.importe > 0); // Solo requiere fecha y precio
                        
                        if (nuevos.length > 0) {
                            const sinNormalizar = nuevos.filter(r => !r.normalizado).length;
                            guardarRegistros([...registros, ...nuevos]);
                            alert(`✅ ${nuevos.length} registros importados\n\n${sinNormalizar > 0 ? `⚠️ ${sinNormalizar} pendientes de normalizar` : '✅ Todos normalizados'}`);
                        } else {
                            alert('❌ No se encontraron registros válidos.\n\nVerificá que el Excel tenga columnas: FECHA y PRECIO');
                        }
                    } catch (error) {
                        console.error('Error importando:', error);
                        alert('❌ Error al importar. Verificá el formato del Excel.');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = '';
            };
            
            if (cargando) {

        // GENERADOR DE HISTORIAS PARA INSTAGRAM
        function GeneradorHistoriaIG({ reservas, horarios, setView }) {
            // Cargar configuración guardada
            const cargarConfig = () => {
                try {
                    const guardado = localStorage.getItem('historiaIGConfig');
                    return guardado ? JSON.parse(guardado) : null;
                } catch {
                    return null;
                }
            };
            
            const configGuardada = cargarConfig();
            
            const [sucursalId, setSucursalId] = useState(configGuardada?.sucursalId || 1);
            const [fechaInicio, setFechaInicio] = useState(() => {
                if (configGuardada?.fechaInicio) return configGuardada.fechaInicio;
                const hoy = new Date();
                return hoy.toISOString().split('T')[0];
            });
            const [fechaFin, setFechaFin] = useState(() => {
                if (configGuardada?.fechaFin) return configGuardada.fechaFin;
                const fin = new Date();
                fin.setDate(fin.getDate() + 7);
                return fin.toISOString().split('T')[0];
            });
            const [backgroundIndex, setBackgroundIndex] = useState(configGuardada?.backgroundIndex || 0);
            const [opacidad, setOpacidad] = useState(configGuardada?.opacidad || 60);
            
            // Biblioteca de backgrounds - cargar guardados
            const [backgrounds, setBackgrounds] = useState(configGuardada?.backgrounds || [
                'https://images.unsplash.com/photo-1604654894610-df63bc536371?w=1080&h=1920&fit=crop',
                'https://images.unsplash.com/photo-1610992015732-2449b76344bc?w=1080&h=1920&fit=crop',
                'https://images.unsplash.com/photo-1519014816548-bf5fe059798b?w=1080&h=1920&fit=crop',
                'https://images.unsplash.com/photo-1632345031435-8727f6897d53?w=1080&h=1920&fit=crop',
                'https://images.unsplash.com/photo-1599948128020-9a44cd7b0206?w=1080&h=1920&fit=crop',
            ]);
            
            // Guardar configuración cuando cambia
            useEffect(() => {
                const config = {
                    sucursalId,
                    fechaInicio,
                    fechaFin,
                    backgroundIndex,
                    opacidad,
                    backgrounds
                };
                localStorage.setItem('historiaIGConfig', JSON.stringify(config));
            }, [sucursalId, fechaInicio, fechaFin, backgroundIndex, opacidad, backgrounds]);
            
            // Subir fondo personalizado
            const subirFondo = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const nuevosBackgrounds = [...backgrounds, event.target.result];
                    setBackgrounds(nuevosBackgrounds);
                    setBackgroundIndex(backgrounds.length); // Seleccionar el nuevo fondo
                };
                reader.readAsDataURL(file);
            };
            
            // Eliminar fondo
            const eliminarFondo = (index) => {
                if (backgrounds.length <= 1) {
                    alert('Debe haber al menos 1 fondo');
                    return;
                }
                const nuevos = backgrounds.filter((_, i) => i !== index);
                setBackgrounds(nuevos);
                if (backgroundIndex >= nuevos.length) {
                    setBackgroundIndex(nuevos.length - 1);
                }
            };

            const sucursal = SUCURSALES.find(s => s.id === sucursalId);
            
            // Generar días para mostrar
            const generarDias = () => {
                const dias = [];
                
                // Crear fechas sin problemas de timezone
                const [yInicio, mInicio, dInicio] = fechaInicio.split('-').map(Number);
                const [yFin, mFin, dFin] = fechaFin.split('-').map(Number);
                const inicio = new Date(yInicio, mInicio - 1, dInicio);
                const fin = new Date(yFin, mFin - 1, dFin);
                
                // Iterar desde fecha inicio hasta fecha fin
                const fechaActual = new Date(inicio);
                while (fechaActual <= fin) {
                    // Obtener fecha en formato YYYY-MM-DD sin timezone
                    const y = fechaActual.getFullYear();
                    const m = String(fechaActual.getMonth() + 1).padStart(2, '0');
                    const d = String(fechaActual.getDate()).padStart(2, '0');
                    const fechaStr = `${y}-${m}-${d}`;
                    
                    // Obtener horarios configurados para este día
                    const horariosDia = horarios[sucursalId]?.[fechaStr];
                    
                    if (horariosDia && horariosDia.activo) {
                        const horasConfig = horariosDia.horas || [];
                        
                        // Filtrar horas ocupadas
                        const horasDisponibles = horasConfig.filter(hora => {
                            // Verificar si hay reserva en este horario
                            const ocupado = reservas.some(r => {
                                if (r.estado === 'cancelada') return false;
                                if (r.sucursal.id !== sucursalId) return false;
                                const fechaReserva = new Date(r.fecha).toISOString().split('T')[0];
                                if (fechaReserva !== fechaStr) return false;
                                
                                // Verificar si este turno está bloqueado
                                const turnoKey = `${fechaStr}|${hora}`;
                                return r.turnosBloqueados?.includes(turnoKey);
                            });
                            return !ocupado;
                        });
                        
                        // Marcar horas ocupadas con corazón
                        const horasConEstado = horasConfig.map(hora => ({
                            hora,
                            ocupado: !horasDisponibles.includes(hora)
                        }));
                        
                        dias.push({
                            fecha: new Date(fechaActual),
                            dia: fechaActual.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric' }).toUpperCase(),
                            horas: horasConEstado
                        });
                    }
                    
                    // Avanzar al siguiente día
                    fechaActual.setDate(fechaActual.getDate() + 1);
                }
                
                return dias; // Mostrar todos los días del rango seleccionado
            };
            
            const dias = generarDias();
            
            const descargarImagen = () => {
                const canvas = document.getElementById('historia-canvas');
                const link = document.createElement('a');
                link.download = `historia-${sucursal.nombre}-${new Date().toISOString().split('T')[0]}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            
            useEffect(() => {
                const canvas = document.getElementById('historia-canvas');
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const width = 1080;
                const height = 1920;
                
                canvas.width = width;
                canvas.height = height;
                
                // Cargar imagen de fondo
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = backgrounds[backgroundIndex];
                
                img.onload = () => {
                    // Dibujar fondo
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Overlay semi-transparente más oscuro para mejor contraste
                    ctx.fillStyle = `rgba(0, 0, 0, ${(100 - opacidad) / 100})`;
                    ctx.fillRect(0, 0, width, height);
                    
                    // HEADER - Ubicación y mes
                    ctx.fillStyle = 'white';
                    ctx.textAlign = 'center';
                    
                    // Ubicación
                    ctx.font = 'bold 42px Arial';
                    ctx.fillText(`📍 ${sucursal.nombre}`, width / 2, 150);
                    
                    // Mes
                    ctx.font = 'bold 64px Arial';
                    const mes = new Date().toLocaleDateString('es-AR', { month: 'long' }).toUpperCase();
                    ctx.fillText(mes, width / 2, 240);
                    
                    // Línea decorativa
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(200, 270);
                    ctx.lineTo(880, 270);
                    ctx.stroke();
                    
                    // DÍAS Y HORARIOS
                    let y = 350;
                    const totalDias = dias.length;
                    const espacioMinimo = 100; // Espacio mínimo entre fin de horarios y siguiente día
                    
                    for (let d = 0; d < totalDias; d++) {
                        const dia = dias[d];
                        
                        // Nombre del día
                        ctx.font = 'bold 48px Arial';
                        ctx.fillStyle = 'white';
                        ctx.fillText(dia.dia, width / 2, y);
                        y += 70;
                        
                        // Horarios - máximo 5 por línea
                        const horasPorLinea = 5;
                        const lineas = [];
                        for (let i = 0; i < dia.horas.length; i += horasPorLinea) {
                            lineas.push(dia.horas.slice(i, i + horasPorLinea));
                        }
                        
                        // Dibujar cada línea de horarios
                        lineas.forEach((lineaHoras, indexLinea) => {
                            ctx.font = 'bold 38px Arial';
                            const totalHoras = lineaHoras.length;
                            const espacioEntre = 150;
                            const anchoTotal = (totalHoras - 1) * espacioEntre;
                            let x = (width - anchoTotal) / 2;
                            
                            lineaHoras.forEach(h => {
                                if (h.ocupado) {
                                    // Hora semi-transparente detrás
                                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                                    ctx.fillText(h.hora, x, y);
                                    
                                    // Corazón encima
                                    ctx.fillStyle = 'white';
                                    ctx.font = 'bold 48px Arial';
                                    ctx.fillText('❤️', x, y);
                                    ctx.font = 'bold 38px Arial';
                                } else {
                                    // Hora disponible
                                    ctx.fillStyle = 'white';
                                    ctx.fillText(h.hora, x, y);
                                }
                                x += espacioEntre;
                            });
                            
                            y += 65; // Espacio entre líneas de horarios del mismo día
                        });
                        
                        // Agregar espacio fijo para el siguiente día (desde donde terminamos)
                        y += espacioMinimo;
                    }
                    
                    // FOOTER - Espacio reservado (más compacto)
                    const footerY = 1850;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.fillRect(150, footerY, width - 300, 50);
                    
                    // Placeholder más discreto
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.font = '28px Arial';
                    ctx.fillText('(Espacio para sticker de enlace)', width / 2, footerY + 35);
                };
            }, [sucursalId, fechaInicio, fechaFin, backgroundIndex, opacidad, dias]);
            
            return (
                <div className="min-h-screen bg-gray-100 p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-6 flex items-center justify-between">
                            <h1 className="text-3xl font-bold">📸 Generador de Historia IG</h1>
                            <button onClick={() => setView('admin')} className="px-4 py-2 bg-gray-200 rounded-lg">← Volver</button>
                        </div>
                        
                        <div className="grid md:grid-cols-2 gap-6">
                            {/* Controles */}
                            <div className="bg-white rounded-xl shadow p-6 space-y-6">
                                <div>
                                    <label className="block font-semibold mb-2">📍 Sucursal</label>
                                    <select value={sucursalId} onChange={(e) => setSucursalId(parseInt(e.target.value))}
                                        className="w-full p-3 border-2 rounded-lg text-base">
                                        {SUCURSALES.map(s => (
                                            <option key={s.id} value={s.id}>{s.nombre}</option>
                                        ))}
                                    </select>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block font-semibold mb-2">📅 Desde</label>
                                        <input type="date" value={fechaInicio}
                                            onChange={(e) => setFechaInicio(e.target.value)}
                                            className="w-full p-3 border-2 rounded-lg" />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-2">📅 Hasta</label>
                                        <input type="date" value={fechaFin}
                                            onChange={(e) => setFechaFin(e.target.value)}
                                            className="w-full p-3 border-2 rounded-lg" />
                                    </div>
                                </div>
                                {dias.length === 0 && (
                                    <div className="bg-yellow-50 border-l-4 border-yellow-500 p-3 text-sm text-yellow-800">
                                        ⚠️ No hay horarios configurados para este rango de fechas
                                    </div>
                                )}
                                {dias.length > 6 && (
                                    <div className="bg-blue-50 border-l-4 border-blue-500 p-3 text-sm text-blue-800">
                                        ℹ️ Con muchos días, el espaciado se ajusta automáticamente. Recomendamos máximo 5 días para mejor legibilidad.
                                    </div>
                                )}
                                
                                <div>
                                    <label className="block font-semibold mb-2">🖼️ Fondo</label>
                                    <div className="grid grid-cols-3 gap-3 mb-3">
                                        {backgrounds.map((bg, i) => (
                                            <div key={i} className="relative">
                                                <button
                                                    onClick={() => setBackgroundIndex(i)}
                                                    className={`aspect-[9/16] rounded-lg overflow-hidden border-4 w-full ${
                                                        backgroundIndex === i ? 'border-pink-500' : 'border-gray-200'
                                                    }`}>
                                                    <img src={bg} alt={`Fondo ${i + 1}`} className="w-full h-full object-cover" />
                                                </button>
                                                {backgrounds.length > 1 && (
                                                    <button
                                                        onClick={() => eliminarFondo(i)}
                                                        className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs font-bold hover:bg-red-600">
                                                        ×
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <label className="block w-full p-3 border-2 border-dashed border-gray-300 rounded-lg text-center cursor-pointer hover:border-pink-500 hover:bg-pink-50 transition-colors">
                                        <span className="text-sm">+ Subir tu propia foto</span>
                                        <input type="file" accept="image/*" onChange={subirFondo} className="hidden" />
                                    </label>
                                </div>
                                
                                <div>
                                    <label className="block font-semibold mb-2">🎨 Opacidad del fondo: {opacidad}%</label>
                                    <input type="range" min="0" max="100" value={opacidad}
                                        onChange={(e) => setOpacidad(parseInt(e.target.value))}
                                        className="w-full" />
                                    <p className="text-xs text-gray-500 mt-1">Más bajo = fondo más oscuro</p>
                                </div>
                                
                                <button onClick={descargarImagen}
                                    className="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white py-4 rounded-xl font-bold text-lg">
                                    📥 Descargar para Instagram

                                <div className="bg-blue-50 border-l-4 border-blue-500 p-4 text-sm">
                                    <p className="text-blue-900">
                                        <strong>💡 Tip:</strong> Los corazones ❤️ muestran turnos ocupados (se ve el horario detrás). Al publicar en Instagram, agregá un sticker de enlace en el footer. Tu configuración (fechas, fondos) se guarda automáticamente.
                                    </p>
                                </div>
                            </div>
                            
                            {/* Preview */}
                            <div className="bg-white rounded-xl shadow p-6">
                                <h2 className="font-bold mb-4 text-center">Preview (escala reducida)</h2>
                                <div className="flex justify-center">
                                    <div className="shadow-2xl rounded-3xl overflow-hidden" style={{width: '270px', height: '480px'}}>
                                        <canvas id="historia-canvas" style={{width: '100%', height: '100%'}} />

                                </div>

                </div>

        function App() {
            const [view, setView] = useState('client');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [reservas, setReservas] = useState([]);
            const [servicios, setServicios] = useState(DEFAULT_SERVICIOS);
            const [señaFija, setSeñaFija] = useState(2000);
            const [password, setPassword] = useState('admin123');
            const [linkMPago, setLinkMPago] = useState('https://mpago.la/2SL1Ew9');
            const [telAdmin, setTelAdmin] = useState('5492920601373');
            const [horarios, setHorarios] = useState({
                // Estructura: { sucursalId: { 'YYYY-MM-DD': { activo: true, horas: ['09:00', '09:30', ...] } } }
                1: {}, // Bahía Blanca - se llenará dinámicamente
                2: {}  // Patagones - se llenará dinámicamente
            });

            useEffect(() => {
                // Detectar si viene del link de comprobante
                const urlParams = new URLSearchParams(window.location.search);
                const compId = urlParams.get('comp');
                const confirmarId = urlParams.get('confirmar');
                
                if (compId) {
                    setView('subir-comprobante');
                }
                
                if (confirmarId) {
                    setView('confirmar-reserva');
                }

                // Cargar datos desde Firebase en tiempo real
                const cargarDatos = async () => {
                    try {
                        // Cargar configuración
                        const config = await FirebaseDB.get('configuracion');
                        if (config) {
                            if (config.servicios) setServicios(config.servicios);
                            if (config.seña) setSeñaFija(config.seña);
                            if (config.linkMPago) setLinkMPago(config.linkMPago);
                            if (config.telAdmin) setTelAdmin(config.telAdmin);
                            if (config.horarios) setHorarios(config.horarios);
                            if (config.password) setPassword(config.password);
                        } else {
                            // Primera vez - guardar defaults
                            await FirebaseDB.set('configuracion', {
                                servicios: DEFAULT_SERVICIOS,
                                seña: 2000,
                                linkMPago: 'https://mpago.la/2SL1Ew9',
                                telAdmin: '5492920601373',
                                horarios: { 1: {}, 2: {} },
                                password: 'admin123'
                            });
                        }

                        // Cargar reservas
                        const reservas = await FirebaseDB.get('reservas');
                        if (reservas) {
                            setReservas(Object.values(reservas));
                        }

                        // Escuchar cambios en tiempo real
                        FirebaseDB.listen('configuracion', (data) => {
                            if (data) {
                                if (data.servicios) setServicios(data.servicios);
                                if (data.seña) setSeñaFija(data.seña);
                                if (data.linkMPago) setLinkMPago(data.linkMPago);
                                if (data.telAdmin) setTelAdmin(data.telAdmin);
                                if (data.horarios) setHorarios(data.horarios);
                            }
                        });

                        FirebaseDB.listen('reservas', (data) => {
                            if (data) {
                                setReservas(Object.values(data));
                            } else {
                                setReservas([]);
                            }
                        });

                    } catch (error) {
                        console.error('Error cargando datos:', error);
                        alert('Error conectando con el servidor. Recargá la página.');
                    }
                };

                cargarDatos();

                // Cleanup
                return () => {
                    FirebaseDB.unlisten('configuracion');
                    FirebaseDB.unlisten('reservas');
                };
            }, []);
            
            // Sincronización automática diaria a las 23:59
            useEffect(() => {
                const sincronizarAutomaticamente = async () => {
                    try {
                        // Obtener registros actuales de análisis
                        const registrosActuales = await FirebaseDB.get('registrosIngresos') || [];
                        
                        // Obtener fecha de hoy en formato YYYY-MM-DD
                        const hoy = new Date();
                        hoy.setHours(0, 0, 0, 0);
                        const hoyStr = hoy.toISOString().split('T')[0];
                        
                        // Filtrar reservas confirmadas cuya fecha ya pasó (hasta hoy inclusive)
                        const reservasParaRegistrar = reservas.filter(r => {
                            if (r.estado !== 'confirmada' || r.esFicticia) return false;
                            
                            // Verificar que la fecha de la reserva sea hoy o anterior
                            const fechaReserva = new Date(r.fecha);
                            fechaReserva.setHours(0, 0, 0, 0);
                            
                            if (fechaReserva > hoy) return false; // Reserva futura, no registrar
                            
                            // Verificar si ya existe en registros
                            const yaExiste = registrosActuales.some(reg => 
                                reg.clienta === r.cliente.nombre && 
                                reg.fecha === r.fecha &&
                                reg.importe === r.servicios.reduce((sum, s) => sum + s.precio, 0)
                            );
                            
                            return !yaExiste;
                        });
                        
                        if (reservasParaRegistrar.length > 0) {
                            console.log(`[Auto-sync] Registrando ${reservasParaRegistrar.length} reservas del día`);
                            
                            const nuevosRegistros = reservasParaRegistrar.map(r => ({
                                id: Date.now() + Math.random(),
                                fecha: r.fecha,
                                clienta: r.cliente.nombre,
                                servicios: r.servicios.map(s => s.nombre),
                                importe: r.servicios.reduce((sum, s) => sum + s.precio, 0),
                                metodoPago: 'transferencia',
                                sucursal: r.sucursal.nombre,
                                notas: 'Auto-registrado',
                                fechaCreacion: new Date().toISOString()
                            }));
                            
                            await FirebaseDB.set('registrosIngresos', [...registrosActuales, ...nuevosRegistros]);
                            console.log(`[Auto-sync] ✅ ${nuevosRegistros.length} registros agregados`);
                        }
                    } catch (error) {
                        console.error('[Auto-sync] Error:', error);
                    }
                };
                
                // Calcular tiempo hasta las 23:59
                const programarSincronizacion = () => {
                    const ahora = new Date();
                    const proximaSincronizacion = new Date();
                    proximaSincronizacion.setHours(23, 59, 0, 0);
                    
                    // Si ya pasaron las 23:59 de hoy, programar para mañana
                    if (ahora > proximaSincronizacion) {
                        proximaSincronizacion.setDate(proximaSincronizacion.getDate() + 1);
                    }
                    
                    const tiempoHasta = proximaSincronizacion - ahora;
                    console.log(`[Auto-sync] Próxima sincronización en ${Math.round(tiempoHasta / 1000 / 60)} minutos`);
                    
                    return setTimeout(() => {
                        sincronizarAutomaticamente();
                        // Reprogramar para el día siguiente
                        programarSincronizacion();
                    }, tiempoHasta);
                };
                
                // Ejecutar sincronización inmediata al cargar (para recuperar días anteriores)
                sincronizarAutomaticamente();
                
                // Programar sincronización diaria
                const timerId = programarSincronizacion();
                
                return () => clearTimeout(timerId);
            }, [reservas]);

            const guardarReservas = async (r) => {
                // Convertir array a objeto con IDs como keys
                const reservasObj = {};
                r.forEach(reserva => {
                    reservasObj[reserva.id] = reserva;
                });
                await FirebaseDB.set('reservas', reservasObj);
            };

            const guardarConfig = async () => {
                await FirebaseDB.set('configuracion', {
                    servicios,
                    seña: señaFija,
                    linkMPago,
                    telAdmin,
                    horarios,
                    password: password || 'admin123' // Guardar contraseña (por defecto admin123)
                });
            };

            const agregarReserva = (reserva) => {
                // Calcular duración total de los servicios
                const duracionTotal = reserva.servicios.reduce((sum, s) => sum + s.duracion, 0);
                
                const nueva = {
                    ...reserva,
                    id: Date.now(),
                    estado: 'pendiente',
                    fechaCreacion: new Date().toISOString(),
                    duracionTotal: duracionTotal, // Guardar duración total
                    turnosBloqueados: calcularTurnosBloqueados(reserva.fecha, reserva.hora, duracionTotal)
                };
                const nuevas = [...reservas, nueva];
                guardarReservas(nuevas);
                
                // Enviar email de notificación al admin
                setTimeout(() => {
                    enviarEmailNotificacion(nueva);
                }, 1000);
                
                return nueva;
            };

        // SUBIR COMPROBANTE (Vista de la clienta)
        function SubirComprobante({ reservas, guardarReservas, señaFija }) {
            const [subiendo, setSubiendo] = useState(false);
            const [exito, setExito] = useState(false);

            const urlParams = new URLSearchParams(window.location.search);
            const reservaId = parseInt(urlParams.get('comp'));
            const reserva = reservas.find(r => r.id === reservaId);

            if (!reserva) {

                    </div>
                );

            if (reserva.estado === 'confirmada') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">

                                <p><strong>Sucursal:</strong> {reserva.sucursal.nombre}</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (exito) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gray-100">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">

                            </div>
                        </div>
                    </div>
                );
            }

            const subirArchivo = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setSubiendo(true);

                // Comprimir imagen antes de guardar
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    // Redimensionar si es muy grande (máx 400px para email)
                    const maxSize = 400;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = (height / width) * maxSize;
                            width = maxSize;
                        } else {
                            width = (width / height) * maxSize;
                            height = maxSize;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convertir a base64 con calidad muy reducida para email
                    const base64 = canvas.toDataURL('image/jpeg', 0.5);
                    
                    // Actualizar reserva con comprobante
                    const actualizadas = reservas.map(r => 
                        r.id === reservaId 
                            ? { ...r, comprobante: base64, fechaComprobante: new Date().toISOString() }
                            : r
                    );
                    guardarReservas(actualizadas);
                    
                    // Enviar email al admin con el comprobante
                    const reservaActualizada = actualizadas.find(r => r.id === reservaId);
                    if (reservaActualizada) {
                        setTimeout(() => {
                            enviarEmailComprobanteGlobal(reservaActualizada, base64, señaFija);
                        }, 1000);
                    }
                    
                    setSubiendo(false);
                    setExito(true);
                };
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-blue-100">
                    <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <span className="text-white font-bold text-2xl">A</span>
                            </div>
                            <h2 className="text-2xl font-bold mb-2">Subí tu comprobante</h2>
                            <p className="text-gray-600">Hola {reserva.cliente.nombre}</p>
                        </div>

                        <div className="bg-pink-50 rounded-xl p-4 mb-6">
                            <p className="text-sm text-gray-600 mb-2">Tu reserva:</p>
                            <p className="font-semibold">{reserva.servicios.map(s => s.nombre).join(', ')}</p>
                            <p className="text-sm text-gray-600">{new Date(reserva.fecha).toLocaleDateString('es-AR')} - {reserva.hora}</p>
                            <p className="text-sm text-gray-600">{reserva.sucursal.nombre}</p>
                            <p className="text-lg font-bold text-green-600 mt-2">Seña: ${señaFija}</p>
                        </div>

                        <div className="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center mb-4 hover:border-blue-400 transition-colors">
                            <input 
                                type="file" 
                                accept="image/*" 
                                onChange={subirArchivo}
                                className="hidden"
                                id="file-upload"
                                disabled={subiendo}
                            />
                            <label htmlFor="file-upload" className="cursor-pointer">
                                {subiendo ? (
                                    <div>
                                        <div className="text-4xl mb-2">📤</div>
                                        <p className="text-gray-600">Subiendo...</p>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="text-5xl mb-2">📸</div>
                                        <p className="font-semibold text-gray-700 mb-1">Click para subir</p>
                                        <p className="text-sm text-gray-500">Foto o captura de pantalla</p>
                                    </div>
                                )}
                            </label>
                        </div>

                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded text-sm">
                            <p className="text-blue-900">
                                <strong>💡 Tip:</strong> Asegurate que se vea claramente el monto de ${señaFija} y la fecha del pago.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // VISTA CLIENTE

                        {pendientes.length > 0 && (

                                <div className="space-y-3">

                                            <div>
                                                <p className="font-bold">{r.cliente.nombre}</p>
                                                <p className="text-sm text-gray-600">{r.servicios.map(s => s.nombre).join(', ')}</p>

                        <div className="bg-white rounded-xl shadow">

                                    {filtro === 'todas' && 'Todas las Reservas'}
                                    {filtro === 'pendientes' && 'Esperando Pago'}
                                    {filtro === 'conComprobante' && 'Con Comprobante'}
                                    {filtro === 'confirmadas' && 'Confirmadas'}
                                </h3>
                                {filtro !== 'todas' && (

                            <div className="p-4">
                                {(() => {
                                    let reservasFiltradas = reservas;
                                    if (filtro === 'pendientes') reservasFiltradas = pendientes;
                                    else if (filtro === 'conComprobante') reservasFiltradas = conComprobante;
                                    else if (filtro === 'confirmadas') reservasFiltradas = reservas.filter(r => r.estado === 'confirmada');
                                    
                                    return reservasFiltradas.length === 0 ? (
                                        <p className="text-gray-500 text-center py-8">No hay reservas en esta categoría</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {reservasFiltradas.map(r => (
                                                <div key={r.id} className="border-l-4 border-blue-500 bg-gray-50 p-4 rounded flex justify-between">
                                                    <div>
                                                        <p className="font-bold">{r.cliente.nombre}</p>
                                                        <p className="text-sm">{r.servicios.map(s => s.nombre).join(', ')}</p>

                                                            className="px-3 py-2 bg-red-500 text-white rounded-lg text-sm font-semibold hover:bg-red-600"

                                                            🗑️
                                                        </button>

                                                            {r.estado === 'pendiente' && !r.comprobante && <span className="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs">Esperando pago</span>}
                                                            {r.estado === 'pendiente' && r.comprobante && <span className="px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-xs">Con comprobante</span>}
                                                            {r.estado === 'confirmada' && <span className="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs">Confirmada</span>}
